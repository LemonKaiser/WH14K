- type: entity
  id: EnergyDomeBase
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Effects
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.8
        density: 0
        mask:
        - None
        layer:
        - BulletImpassable
        - Opaque
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: HardLightBarrier
  - type: Appearance
  - type: EnergyDomeVisuals
    effectStartCharge: 0.80
    effectFullCharge: 0.01
    maxCoverage: 0.80
    minCoverageFactor: 0.12
    coverageExponent: 1.20
    darkenCoreStrength: 0.42
    darkenHazeStrength: 0.12
    alphaCoreStrength: 0.24
    alphaHazeStrength: 0.10
    minColorFactor: 0.18
    minAlphaFactor: 0.35
    insideTransparencyEnabled: true
    insideTransparencyAlpha: 0.45
    insideTransparencyRadius: 0.95
    insideTransparencyFadeSpeed: 8.0
  - type: AmbientSound
    volume: 35
    range: 5
    sound:
      path: /Audio/Machines/energyshield_ambient.ogg
  - type: EnergyDome
  - type: Tag
    tags:
    - HideContextMenu
    - WH40K

- type: entity
  id: EnergyDomeSmallRed
  categories: [ HideSpawnMenu ]
  parent: EnergyDomeBase
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.9
        density: 0
        mask:
        - None
        layer:
        - BulletImpassable
        - Opaque
  - type: Sprite
    scale: 0.95, 0.95
    sprite: Effects/EnergyDome/energydome_small.rsi
    layers:
    - state: small
      color: "#b00000"
  - type: EnergyDomeVisuals
    insideTransparencyRadius: 0.85
  - type: PointLight
    enabled: true
    radius: 5
    power: 2
    color: "#b00000"

