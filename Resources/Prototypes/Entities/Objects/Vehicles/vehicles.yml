- type: entity
  id: VehicleUnicycle
  parent: [BaseVehicleStrap, BaseFoldable, BaseItem]
  name: unicycle
  description: It only has one wheel!
  components:
  - type: Vehicle
    hornSound:
      path: /Audio/Effects/Vehicle/bicyclebell.ogg
  - type: Sprite
    sprite: Objects/Vehicles/unicycle.rsi
    layers:
    - state: vehicle
      map: ["unfoldedLayer"]
    - state: vehicle_folded
      map: ["foldedLayer"]
      visible: false
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Strap
    buckleOffset: "0.1,-0.05"
  - type: MovementSpeedModifier
    acceleration: 1
    friction: 0.8
    baseWalkSpeed: 3.5
    baseSprintSpeed: 4.3
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 240
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

- type: entity
  parent: VehicleUnicycle
  id: VehicleUnicycleFolded
  suffix: folded
  components:
  - type: Foldable
    folded: true
  - type: Strap
    enabled: false
