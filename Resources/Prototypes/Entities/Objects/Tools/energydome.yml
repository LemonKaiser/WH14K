- type: entity
  id: EnergyDomeGeneratorPersonalSyndie
  parent: BaseItem
  name: blood-red personal shield generator
  description: A personal shield generator that protects the wearer from lasers and bullets but makes ranged combat much harder.
  components:
  - type: Item
    size: Ginormous
  - type: Clothing
    quickEquip: false
    slots:
    - Belt
  - type: Sprite
    sprite: Objects/Tools/EnergyDome/syndie.rsi
    layers:
    - state: icon
  - type: Tag
    tags:
    - WH40K
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellSmall
        whitelist:
          tags:
          - PowerCell
          - PowerCellSmall
  - type: EnergyDomeGenerator
    enabledOnSpawn: false
    globalEnabled: false
    damageEnergyDraw: 5
    domePrototype: EnergyDomeSmallRed
    useModeProfiles: true
    useSizeColorProfiles: false
    useAutoResponseProfiles: false
    mode: Bubble
    size: Small
    color: Red
    wallSide: Front
    autoResponseProfile: HoldLine
    bubbleDomePrototype: EnergyDomeSmallRed
    wallDomePrototype: EnergyDomeSmallRedDirected
    activationEnergyCost: 14
    passiveEnergyDraw: 1.2
    impactEnergyDrawMultiplier: 1.0
    bubbleCostMultiplier: 1.0
    wallCostMultiplier: 0.62
    wallForwardOffset: 1.0
    heatImpactMultiplier: 1.10
    piercingImpactMultiplier: 1.20
    otherImpactMultiplier: 1.0
    burstWindow: 0.60
    burstStepMultiplier: 0.15
    burstMaxMultiplier: 1.95
    stressEnabled: true
    stressPerDamage: 0.0038
    stressDecayPerSecond: 0.09
    stressDecayInactiveMultiplier: 1.45
    stressImpactEnergyMultiplier: 0.75
    stressPassiveEnergyMultiplier: 0.50
    stressBreakThreshold: 1.00
    stressWarningThreshold: 0.62
    teamId: Neutral
    interiorRadiusMultiplier: 1.0
    linkEnabled: false
  - type: UserInterface
    interfaces:
      enum.EnergyDomeUiKey.Key:
        type: EnergyDomeBoundUserInterface
  - type: PowerCellDraw
    enabled: false
    drawRate: 0
  - type: UseDelay
    delay: 10.0

- type: entity
  id: EnergyDomeDirectionalTurtle
  parent: BaseStructureDynamic
  name: BR-40c "Turtle"
  description: A heavy deployable energy barrier projector with very low passive power draw. Can be controlled through a multitool link.
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: Objects/Tools/EnergyDome/reinhardt.rsi
    layers:
    - state: icon
  - type: Tag
    tags:
    - WH40K
  - type: InteractionOutline
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellSmall
        whitelist:
          tags:
          - PowerCell
          - PowerCellSmall
  - type: EnergyDomeGenerator
    enabledOnSpawn: false
    globalEnabled: false
    damageEnergyDraw: 7
    domePrototype: EnergyDomeMediumBlueDirected
    canDeviceNetworkUse: true
    useModeProfiles: true
    useSizeColorProfiles: true
    mode: Wall
    size: Medium
    color: Blue
    wallSide: Front
    bubbleDomePrototype: EnergyDomeMediumBlue
    wallDomePrototype: EnergyDomeMediumBlueDirected
    activationEnergyCost: 8
    passiveEnergyDraw: 0.45
    impactEnergyDrawMultiplier: 0.95
    bubbleCostMultiplier: 1.0
    wallCostMultiplier: 0.55
    wallForwardOffset: 1.0
    heatImpactMultiplier: 1.0
    piercingImpactMultiplier: 1.15
    otherImpactMultiplier: 1.0
    burstWindow: 0.75
    burstStepMultiplier: 0.12
    burstMaxMultiplier: 1.70
    stressEnabled: true
    stressPerDamage: 0.0029
    stressDecayPerSecond: 0.075
    stressDecayInactiveMultiplier: 1.35
    stressImpactEnergyMultiplier: 0.60
    stressPassiveEnergyMultiplier: 0.40
    stressBreakThreshold: 1.00
    stressWarningThreshold: 0.68
    teamId: Neutral
    contestedCheckInterval: 0.25
    contestedRequireDistinctTeams: true
    interiorRadiusMultiplier: 1.0
    linkEnabled: true
    linkRange: 8.0
    linkMaxPeers: 2
    linkReserveCharge: 35.0
    linkTransferEfficiency: 0.88
    linkRequireActiveDonor: false
  - type: UserInterface
    interfaces:
      enum.EnergyDomeUiKey.Key:
        type: EnergyDomeBoundUserInterface
  - type: PowerCellDraw
    enabled: false
    drawRate: 0
  - type: UseDelay
    delay: 10.0
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSink
    ports:
    - Toggle
    - On
    - Off

- type: entity
  id: EnergyDomeDirectionalTurtleImperium
  parent: EnergyDomeDirectionalTurtle
  name: BR-40c "Turtle" (Imperium)
  components:
  - type: EnergyDomeGenerator
    teamId: Imperium
