- type: entity
  name: binoculars
  parent: BaseItem
  id: Binoculars
  description: Used for long-distance surveillance.
  components:
  - type: Sprite
    sprite: Objects/Tools/binoculars.rsi
    state: icon
  - type: Item
    size: Normal
  - type: Clothing
    sprite: Objects/Tools/binoculars.rsi
    quickEquip: false
    slots:
    - Neck
  - type: Wieldable
  - type: UseDelay
    delay: 1.0
  - type: AimingCamera
    maxOffset: 10
    pvsIncrease: 1.0
    requireWield: true
  - type: WH40KRangefinder
    range: 70
    markerLifetime: 45
    targetDelay: 0.5
    switchModeDelay: 0.5
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
      Glass: 50
  - type: StaticPrice
    price: 100
