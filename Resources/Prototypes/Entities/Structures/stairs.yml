    sprite: Structures/stairs.rsi
    state: stairs_stage_wood
    drawdepth: FloorTiles
  - type: Appearance
  - type: Flammable
    alwaysCombustible: true
    firestacksOnIgnite: 1
    firestackFade: 0
    damage:
      types:
        Heat: 0
  - type: FireVisuals
