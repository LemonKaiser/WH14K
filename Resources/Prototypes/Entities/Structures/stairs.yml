- type: entity
  abstract: true
  id: BaseFloorDecoration
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Sprite
    drawdepth: FloorTiles

- type: entity
  id: Stairs
  parent: BaseFloorDecoration
  name: stairs
  suffix: Steel
  description: The greatest invention since rocket-propelled grenades.
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: Sprite
    sprite: Structures/stairs.rsi
    state: stairs_steel
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 4
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: StairStage
  parent: Stairs
  suffix: Steel, stage
  components:
  - type: Sprite
    sprite: Structures/stairs.rsi
    state: stairs_stage_steel
    drawdepth: FloorTiles

- type: entity
  id: StairWhite
  parent: Stairs
  suffix: White
  components:
  - type: Sprite
    sprite: Structures/stairs.rsi
    state: stairs_white
    drawdepth: FloorTiles

- type: entity
  id: StairStageWhite
  parent: Stairs
  suffix: White, stage
  components:
  - type: Sprite
    sprite: Structures/stairs.rsi
    state: stairs_stage_white
    drawdepth: FloorTiles

- type: entity
  id: StairDark
  parent: Stairs
  suffix: Dark
  components:
  - type: Sprite
    sprite: Structures/stairs.rsi
    state: stairs_dark
    drawdepth: FloorTiles

- type: entity
  id: StairStageDark
  parent: Stairs
  suffix: Dark, stage
  components:
  - type: Sprite
    sprite: Structures/stairs.rsi
    state: stairs_stage_dark
    drawdepth: FloorTiles

- type: entity
  id: StairWood
  parent: Stairs
  suffix: Wood
  components:
  - type: Sprite
    sprite: Structures/stairs.rsi
    state: stairs_wood
    drawdepth: FloorTiles
  - type: Appearance
  - type: Flammable
    alwaysCombustible: true
    firestacksOnIgnite: 1
    firestackFade: 0
    damage:
      types:
        Heat: 0
  - type: FireVisuals
    sprite: Effects/fire.rsi
    normalState: 5
    alternateState: 6
    fireStackAlternateState: 1
    offset: "0, 0.08"
    scale: "1.05, 1.05"
  - type: WH40KFireConsumable
    burnTime: 6

- type: entity
  id: StairStageWood
  parent: Stairs
  suffix: Wood, stage
  components:
