- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceAstartes
  categories: [ HideSpawnMenu ]
  name: astartes appearance
  components:
  - type: Inventory
    speciesId: Astartes
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Astartes/displacement.rsi
            state: jumpsuit
      gloves:
        sizeMaps:
          32:
            sprite: Mobs/Species/Astartes/displacement.rsi
            state: hand
      shoes:
        sizeMaps:
          32:
            sprite: Mobs/Species/Astartes/displacement.rsi
            state: shoes
  - type: InitialBody
    organs:
      Torso: OrganAstartesTorso
      Head: OrganAstartesHead
      ArmLeft: OrganAstartesArmLeft
      ArmRight: OrganAstartesArmRight
      HandRight: OrganAstartesHandRight
      HandLeft: OrganAstartesHandLeft
      LegLeft: OrganAstartesLegLeft
      LegRight: OrganAstartesLegRight
      FootLeft: OrganAstartesFootLeft
      FootRight: OrganAstartesFootRight
      Brain: OrganAstartesBrain
      Eyes: OrganAstartesEyes
      Tongue: OrganAstartesTongue
      Appendix: OrganAstartesAppendix
      Ears: OrganAstartesEars
      Lungs: OrganAstartesLungs
      Heart: OrganAstartesHeart
      Stomach: OrganAstartesStomach
      Liver: OrganAstartesLiver
      Kidneys: OrganAstartesKidneys
  - type: HumanoidProfile
    species: Astartes

- type: entity
  parent:
  - AppearanceAstartes
  - BaseSpeciesMobOrganic
  id: MobAstartes
  name: Urist McAstartes
  components:
  - type: DamageVisuals
    thresholds: [ 30, 60, 90, 150, 210, 300 ]
    targetLayers:
    - "enum.HumanoidVisualLayers.Chest"
    - "enum.HumanoidVisualLayers.Head"
    - "enum.HumanoidVisualLayers.LArm"
    - "enum.HumanoidVisualLayers.LLeg"
    - "enum.HumanoidVisualLayers.RArm"
    - "enum.HumanoidVisualLayers.RLeg"
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Species/Astartes/brute_damage.rsi
        color: "#FF0000"
      Burn:
        sprite: Mobs/Species/Astartes/burn_damage.rsi
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.25
    baseSprintSpeed: 4.05
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 80
        Structural: 20
  - type: ActionGun
    action: ActionWH40KAstartesToxicSpit
    gunProto: WH40KAstartesToxicSpitGun
  - type: WH40KChaplainDash
    cooldownSeconds: 60
    dashRange: 3
    damage: 0
    knockdownSeconds: 2
    stunSeconds: 1
    actionPrototype: ActionWH40KAstartesDash
    voiceLine: null
  - type: MobThresholds
    thresholds:
      0: Alive
      450: Critical
      900: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 1200
      behaviors:
      - !type:GibBehavior { }
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 4500
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawnInContainer: true
        spawn:
          Ash:
            min: 1
            max: 1
      - !type:BurnBodyBehavior
      - !type:PlaySoundBehavior
        sound:
          collection: MeatLaserImpact
    - trigger:
        !type:DamageTypeTrigger
        damageType: Radiation
        damage: 45
      behaviors:
      - !type:PopupBehavior
        popup: mouth-taste-metal
        popupType: LargeCaution
        targetOnly: true
    - trigger:
        !type:DamageTypeTrigger
        damageType: Radiation
        damage: 120
      behaviors:
      - !type:VomitBehavior
  - type: SlowOnDamage
    speedModifierThresholds:
      270: 0.7
      360: 0.5
  - type: Bloodstream
    bleedReductionAmount: 1
    maxBleedAmount: 30
    bloodRefreshAmount: 3
    bleedPuddleThreshold: 3
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 900
  - type: Stamina
    baseCritThreshold: 300
    animationThreshold: 150
    forceStandStamina: 30
  - type: Speech
    speechSounds: Bass
  - type: SpeciesArmorRequirement
    popup: species-armor-requirement-component-astartes-only

