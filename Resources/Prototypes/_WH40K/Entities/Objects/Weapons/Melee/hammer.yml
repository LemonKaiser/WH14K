- type: entity
  parent: BaseItem
  id: WHHammerImperial
  suffix: WH40K
  components:
  - type: Tag
    tags:
    - FireAxe
  - type: Execution
    doAfterDuration: 4.0
  - type: Sprite
    sprite: _WH40K/Objects/Weapons/Melee/hammer_imperial.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 135
    swingLeft: true
    attackRate: 0.65
    damage:
      types:
        Blunt: 20
        Structural: 50
    angle: 100
    soundHit:
      collection: MetalThud
  # - type: DamageOtherOnHit
  #   meleeDamageMultiplier: 1.5
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 20
        Structural: 40
  - type: Item
    size: Ginormous
  - type: Clothing
    sprite: _WH40K/Objects/Weapons/Melee/hammer_imperial.rsi
    quickEquip: false
    slots:
    - back
  - type: UseDelay
    delay: 1
  - type: StealTarget
    stealGroup: FireAxe
  - type: IgniteOnMeleeHit
    fireStacks: -4
  # Shitmed Change

