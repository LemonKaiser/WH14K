- type: entity
  id: WH40KWeaponPsykerForceStaffBase
  abstract: true
  parent: WeaponStaffBase
  components:
  - type: Sprite
    state: icon
  - type: Item
    size: Normal
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 8

- type: entity
  name: biomantic force staff
  description: A force staff tuned for biomantic workings.
  parent: WH40KWeaponPsykerForceStaffBase
  id: WeaponPsykerForceStaffBiomantic
  suffix: WH40K, Psyker
  components:
  - type: Sprite
    sprite: _WH40K/Objects/Weapons/Guns/Psyker/biomantic_force_staff.rsi
    state: icon
  - type: Item
    sprite: _WH40K/Objects/Weapons/Guns/Psyker/biomantic_force_staff.rsi
    heldPrefix: biomancy
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/Magic/staff_healing.ogg
    projectileSpeed: 20
  - type: BasicEntityAmmoProvider
    proto: ProjectileHealingBolt
    capacity: 5
    count: 5
  - type: PacifismAllowedGun

- type: entity
