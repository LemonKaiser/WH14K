- type: entity
  parent: [BaseItem, BaseGunWieldable]
  id: WeaponCombatShotgun
  suffix: WH40K, Общий
  components:
  - type: GunRequiresWield
  - type: WH40KWeaponModHost
    slotDefinitions:
    - id: optic
      slotType: OpticTop
      name: wh40k-weapon-mod-slot-name-optic
      priority: 120
      whitelist:
        tags:
        - WH40KWeaponModOpticCombatShotgun
    - id: stock
      slotType: StockRear
      name: wh40k-weapon-mod-slot-name-stock
      priority: 117
      whitelist:
        tags:
        - WH40KWeaponModStockCombatShotgun
    - id: muzzle
      slotType: MuzzleFront
      name: wh40k-weapon-mod-slot-name-muzzle
      priority: 115
      whitelist:
        tags:
        - WH40KWeaponModMuzzleCombatShotgun
    - id: bayonet
      slotType: BayonetLug
      name: wh40k-weapon-mod-slot-name-bayonet
      priority: 110
      whitelist:
        tags:
        - WH40KWeaponModBayonetCombatShotgun
    - id: sling
      slotType: SlingMount
      name: wh40k-weapon-mod-slot-name-sling
      priority: 100
      whitelist:
        tags:
        - WH40KWeaponModSlingCombatShotgun
  - type: Item
    size: Huge
    sprite: _WH40K/Objects/Weapons/Guns/Shotguns/combat_shotgun_inhands.rsi
  - type: Sprite
    sprite: _WH40K/Objects/Weapons/Guns/Shotguns/combat_shotgun.rsi
    scale: 0.85,0.85
    layers:
    - state: icon
      map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: _WH40K/Objects/Weapons/Guns/Shotguns/combat_shotgun_inhands.rsi
    quickEquip: false
    slots:
    - suitStorage
  - type: AmmoCounter
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/shotgun.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: WH40KGunPrediction
  - type: MagazineAmmoProvider
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineCombatShotgun
        priority: 2
        whitelist:
          tags:
          - MagazineCombatShotgun
        whitelistFailPopup: gun-magazine-whitelist-fail
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: Appearance
  - type: ClothingSpeedModifier
    walkModifier: 0.97
    sprintModifier: 0.97
  - type: StaticPrice
    price: 500
  - type: CombatSight
    sight:
      sprite: Interface/Misc/crosshair_pointers.rsi
      state: launcher_sight
    unavailable:
      sprite: Interface/Misc/crosshair_pointers.rsi
      state: launcher_bolt_sight
