- type: entity
  parent: WeaponLaserWH40KEnergy
  id: WeaponLaserPlasmaPistol
  suffix: WH40K
  components:
  - type: AimingCamera
    maxOffset: 2
    pvsIncrease: 0.2
    requireWield: false
  - type: Sprite
    sprite: _WH40K/Objects/Weapons/Guns/Battery/plasmapistol.rsi
  - type: Gun
    fireRate: 1
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_WH40K/Weapons/Guns/Gunshots/plasmapist.wav
  - type: WH40KGunPrediction
  - type: WH40KPlasmaOverheat
    chance: 0
    totalIntensity: 1400
    intensitySlope: 160
    maxTileIntensity: 160
    maxTileBreak: 0
    canCreateVacuum: false
    deleteWeapon: true
  - type: WH40KPlasmaFireModes
    fireModes:
    - name: wh40k-plasma-fire-mode-standard
      proto: WHBulletPlasmaPistolStandard
      overheatChance: 0
    - name: wh40k-plasma-fire-mode-overheat
      proto: WHBulletPlasmaPistolOverheat
      overheatChance: 0.02
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: PlasmPistolPowerCell
        whitelist:
          tags:
            - PlasmPowerCellPistol
  - type: Item
    sprite: _WH40K/Objects/Weapons/Guns/Battery/plasmapistol.rsi
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Tag
    tags:
    - Sidearm
  - type: Clothing
    sprite: Objects/Weapons/Guns/Pistols/viper.rsi
    slots:
    - Belt
  - type: CombatSight
    sight:
      sprite: Interface/Misc/crosshair_pointers.rsi
      state: revolver_sight
