- type: entity
  parent: [WeaponLaserWH40KEnergy, BaseGunWieldable]
  id: WeaponHereticLaserLasgun
  suffix: WH40K
  components:
  - type: Sprite
    sprite: _WH40K/Objects/Weapons/Guns/Battery/heretic_lasgun/lasgun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: _WH40K/Objects/Weapons/Guns/Battery/heretic_lasgun/lasgun_in-hands.rsi
    size: Huge
  - type: Appearance
  - type: Clothing
    sprite: _WH40K/Objects/Weapons/Guns/Battery/heretic_lasgun/lasgun_in-hands.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Gun
    fireRate: 1.5
  - type: WH40KWeaponModHost
    slotDefinitions:
    - id: optic
      slotType: OpticTop
      name: wh40k-weapon-mod-slot-name-optic
      priority: 120
      whitelist:
        tags:
        - WH40KWeaponModOpticLasgun
    - id: stock
      slotType: StockRear
      name: wh40k-weapon-mod-slot-name-stock
      priority: 110
      whitelist:
        tags:
        - WH40KWeaponModStockLasgun
    - id: barrel
      slotType: BarrelFront
      name: wh40k-weapon-mod-slot-name-barrel
      priority: 108
      whitelist:
        tags:
        - WH40KWeaponModBarrelLasgun
    - id: underbarrel
      slotType: Underbarrel
      name: wh40k-weapon-mod-slot-name-underbarrel
      priority: 105
      whitelist:
        tags:
        - WH40KWeaponModUnderbarrelLasgun
    - id: laser
      slotType: SideUtility
      name: wh40k-weapon-mod-slot-name-laser
      priority: 103
      whitelist:
        tags:
        - WH40KWeaponModUtilityLasgun
    - id: bayonet
      slotType: BayonetLug
      name: wh40k-weapon-mod-slot-name-bayonet
      priority: 100
      whitelist:
        tags:
        - WH40KWeaponModBayonetLasgun
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      wh40k-weapon-mod-optic: !type:ContainerSlot
      wh40k-weapon-mod-stock: !type:ContainerSlot
      wh40k-weapon-mod-barrel: !type:ContainerSlot
      wh40k-weapon-mod-underbarrel: !type:ContainerSlot
      wh40k-weapon-mod-laser: !type:ContainerSlot
      wh40k-weapon-mod-bayonet: !type:ContainerSlot
