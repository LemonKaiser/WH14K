- type: entity
  id: WH40KWeaponTurretBallisticBase
  abstract: true
  parent: BaseWeaponBallisticTurret
  name: bolter field sentry turret
  description: A deployable frontline sentry built around a bolter-pattern weapon package.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Sentries/rmc_sentry.rsi
    drawdepth: Mobs
    layers:
    - state: defense_base_off
      renderingStrategy: NoRotation
    - state: normal_uac_sentry_handheld
      map: [ "enum.DeployableTurretVisuals.Turret" ]
    - state: normal_uac_sentry_on
      map: [ "enum.DeployableTurretVisuals.Weapon" ]
      visible: false
    - state: defense_base
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
      visible: false
  - type: Icon
    sprite: _RMC14/Objects/Weapons/Sentries/rmc_sentry.rsi
    state: normal_uac_sentry_handheld
  - type: Appearance
  - type: AnimationPlayer
  - type: HTN
    enabled: true
    rootTask:
      task: WH40KEnergyTurretCompound
    blackboard:
      RotateSpeed: !type:Single
        3.141
      SoundTargetInLOS: !type:SoundPathSpecifier
        path: /Audio/Effects/double_beep.ogg
  - type: DeployableTurret
    enabled: true
    deployedFixture: null
    deploymentLength: 0.4
    retractionLength: 0.4
    deployedState: normal_uac_sentry
    retractedState: normal_uac_sentry_handheld
    deployingState: normal_uac_sentry
    retractingState: normal_uac_sentry_handheld
  - type: Gun
    fireRate: 3
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_WH40K/Weapons/Guns/Gunshots/stubber_fire_1.wav
  - type: BallisticAmmoProvider
    proto: BulletBolter
    capacity: 120
    whitelist:
      tags:
      - CartridgeBolter75
  - type: WH40KTurretProfile
    detectionRange: 14
    fireRange: 14
    supportedAmmo: CartridgeBolter75
  - type: TurretTargetSettings
    exemptAccessLevels:
    - Borg
    - BasicSilicon
  - type: WH40KTurretFactionLock

- type: entity
  id: WH40KWeaponTurretImperium
  parent: WH40KWeaponTurretBallisticBase
  suffix: WH40K, Imperium
  components:
  - type: Sprite
    sprite: _WH40K/Objects/Weapons/Guns/Turrets/tarantulaimp.rsi
    drawdepth: Mobs
    layers:
    - state: base
      map: [ "enum.DeployableTurretVisuals.Turret" ]
    - state: blank
      map: [ "enum.DeployableTurretVisuals.Weapon" ]
      visible: false
    - state: blank
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
      visible: false
  - type: Icon
    sprite: _WH40K/Objects/Weapons/Guns/Turrets/tarantulaimp.rsi
    state: base
  - type: DeployableTurret
    deployedState: base
    retractedState: base
    deployingState: base
    retractingState: base
  - type: NpcFactionMember
    factions:
    - Imperium

