  description: A deployable frontline sentry fitted with a multilaser package. Uses lasgun power cells.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Sentries/rmc_sentry.rsi
    drawdepth: Mobs
    layers:
    - state: defense_base_off
      renderingStrategy: NoRotation
    - state: normal_uac_sentry_handheld
      map: [ "enum.DeployableTurretVisuals.Turret" ]
    - state: normal_uac_sentry_on
      map: [ "enum.DeployableTurretVisuals.Weapon" ]
      visible: false
    - state: defense_base
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
      visible: false
  - type: Icon
    sprite: _RMC14/Objects/Weapons/Sentries/rmc_sentry.rsi
    state: normal_uac_sentry_handheld
  - type: Appearance
  - type: AnimationPlayer
  - type: HTN
    enabled: true
    rootTask:
      task: WH40KEnergyTurretCompound
    blackboard:
      RotateSpeed: !type:Single
        3.141
      SoundTargetInLOS: !type:SoundPathSpecifier
        path: /Audio/Effects/double_beep.ogg
  - type: DeployableTurret
    enabled: true
    deployedFixture: null
    deploymentLength: 0.4
    retractionLength: 0.4
    deployedState: normal_uac_sentry
    retractedState: normal_uac_sentry_handheld
    deployingState: normal_uac_sentry
    retractingState: normal_uac_sentry_handheld
  - type: Gun
    fireRate: 2
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_WH40K/Weapons/Guns/Gunshots/lasgunpew.ogg
  - type: WH40KGunPrediction
  - type: MagazineAmmoProvider
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: LasgunPowerCell
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
          - LasgunPowerCell
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
  - type: WH40KTurretProfile
    detectionRange: 14
    fireRange: 14
    supportedAmmo: LasgunPowerCell, BoxLasgunPowerCell
  - type: TurretTargetSettings
    exemptAccessLevels:
    - Borg
    - BasicSilicon
  - type: WH40KTurretFactionLock

