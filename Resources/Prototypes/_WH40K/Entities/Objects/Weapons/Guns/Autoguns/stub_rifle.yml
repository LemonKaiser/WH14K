- type: entity
  parent: BaseWeaponRifle
  id: WeaponStubRifle
  suffix: WH40K, Общий
  components:
  - type: GunRequiresWield
  - type: WH40KWeaponModHost
    slotDefinitions:
    - id: optic
      slotType: OpticTop
      name: wh40k-weapon-mod-slot-name-optic
      priority: 120
      whitelist:
        tags:
        - WH40KWeaponModOpticStubRifle
    - id: muzzle
      slotType: MuzzleFront
      name: wh40k-weapon-mod-slot-name-muzzle
      priority: 115
      whitelist:
        tags:
        - WH40KWeaponModMuzzleStubRifle
    - id: underbarrel
      slotType: Underbarrel
      name: wh40k-weapon-mod-slot-name-underbarrel
      priority: 105
      whitelist:
        tags:
        - WH40KWeaponModUnderbarrelStubRifle
    - id: stock
      slotType: StockRear
      name: wh40k-weapon-mod-slot-name-stock
      priority: 110
      whitelist:
        tags:
        - WH40KWeaponModStockStubRifle
    - id: bayonet
      slotType: BayonetLug
      name: wh40k-weapon-mod-slot-name-bayonet
      priority: 100
      whitelist:
        tags:
        - WH40KWeaponModBayonetStubRifle
  - type: Item
    size: Huge
    sprite: _WH40K/Objects/Weapons/Guns/Autoguns/stub_rifle_inhands.rsi
  - type: Sprite
    sprite: _WH40K/Objects/Weapons/Guns/Autoguns/stub_rifle.rsi
    scale: 0.85,0.85
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _WH40K/Objects/Weapons/Guns/Autoguns/stub_rifle_inhands.rsi
  - type: Gun
    fireRate: 5
    availableModes:
    - SemiAuto
    - Burst
    - FullAuto
    soundGunshot:
      path: /Audio/_WH40K/Weapons/Guns/Gunshots/stubber_fire_1.wav
  - type: WH40KGunPrediction
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineStubRifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineStubRifle
      gun_chamber:
        name: Chamber
        startingItem: Cartridge825mmLong
        priority: 1
        whitelist:
          tags:
            - Cartridge825mmLong
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: HeldSpeedModifier
    walkModifier: 0.98
    sprintModifier: 0.98
  - type: CombatSight
    sight:
      sprite: Interface/Misc/crosshair_pointers.rsi
      state: rifle_sight
    unavailable:
      sprite: Interface/Misc/crosshair_pointers.rsi
      state: rifle_bolt_sight
