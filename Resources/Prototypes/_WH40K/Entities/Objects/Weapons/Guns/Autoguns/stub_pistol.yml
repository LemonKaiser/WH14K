- type: entity
  parent: BaseWeaponPistol
  id: WeaponStubPistol
  suffix: WH40K, Общий
  components:
  - type: WH40KWeaponModHost
    slotDefinitions:
    - id: optic
      slotType: OpticTop
      name: wh40k-weapon-mod-slot-name-optic
      priority: 120
      whitelist:
        tags:
        - WH40KWeaponModOpticStubPistol
    - id: muzzle
      slotType: MuzzleFront
      name: wh40k-weapon-mod-slot-name-muzzle
      priority: 115
      whitelist:
        tags:
        - WH40KWeaponModMuzzleStubPistol
    - id: utility
      slotType: SideUtility
      name: wh40k-weapon-mod-slot-name-laser
      priority: 103
      whitelist:
        tags:
        - WH40KWeaponModUtilityStubPistol
  - type: Sprite
    sprite: _WH40K/Objects/Weapons/Guns/Autoguns/stub_pistol.rsi
    scale: 0.85,0.85
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _WH40K/Objects/Weapons/Guns/Autoguns/stub_pistol.rsi
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineStubPistol
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineStubPistol
      gun_chamber:
        name: Chamber
        startingItem: Cartridge10mm
        priority: 1
        whitelist:
          tags:
            - Cartridge10mm
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
      wh40k-weapon-mod-optic: !type:ContainerSlot
      wh40k-weapon-mod-muzzle: !type:ContainerSlot
      wh40k-weapon-mod-utility: !type:ContainerSlot
  - type: Gun
    fireRate: 3.5
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_WH40K/Weapons/Guns/Gunshots/stubber_fire_3.wav
  - type: WH40KGunPrediction
  - type: CombatSight
    sight:
      sprite: Interface/Misc/crosshair_pointers.rsi
      state: revolver_sight
    unavailable:
      sprite: Interface/Misc/crosshair_pointers.rsi
      state: gun_bolt_sight
