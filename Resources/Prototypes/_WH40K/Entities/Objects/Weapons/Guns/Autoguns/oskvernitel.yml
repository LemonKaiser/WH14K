- type: entity
  id: WH40KOskvernitelWeaponAutocannon
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Specific/Mech/mecha_equipment.rsi
    state: mecha_uac2
  - type: Gun
    fireRate: 2.5
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    minAngle: 5
    maxAngle: 12
    angleIncrease: 1.1
    angleDecay: 12
    soundGunshot:
      path: /Audio/_WH40K/Weapons/Guns/Gunshots/bolter.ogg
  - type: WH40KGunPrediction
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: BallisticAmmoProvider
    capacity: 50
    proto: BulletSentine
    cycleable: false
  - type: BallisticAmmoSelfRefiller
    autoRefillRate: 1s
    firingPausesAutoRefill: true
    autoRefillPauseDuration: 1s

- type: entity
  id: WH40KOskvernitelWeaponSiegeCannon
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _WH40K/Objects/Specific/Mech/mecha.rsi
    state: sentinel_autogun
  - type: Gun
    fireRate: 1
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    minAngle: 4
    maxAngle: 10
    angleIncrease: 1
    angleDecay: 10
    soundGunshot:
      path: /Audio/_WH40K/Weapons/Guns/Gunshots/bolter.ogg
  - type: WH40KGunPrediction
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: BallisticAmmoProvider
    capacity: 5
    proto: WH40KBulletOskvernitelSiegeShell
    cycleable: false
  - type: BallisticAmmoSelfRefiller
    autoRefillRate: 30s
    firingPausesAutoRefill: true
    autoRefillPauseDuration: 30s
