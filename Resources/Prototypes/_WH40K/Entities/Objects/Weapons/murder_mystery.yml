- type: entity
  id: WH40KMurderMysteryKnife
  parent: BaseKnife
  components:
  - type: Tag
    tags:
    - CombatKnife
    - Knife
  - type: Sprite
    sprite: Objects/Weapons/Melee/combat_knife.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.5
    damage:
      types:
        Slash: 200
  - type: LandAtCursor
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 200
  - type: Item
    sprite: Objects/Weapons/Melee/combat_knife.rsi
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/combat_knife.rsi
  - type: DisarmMalus
    malus: 0.225
  - type: ThrowingAngle
    angle: 225
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
          - -0.4,-0.2
          - -0.2,-0.4
          - 0.4,0.2
          - 0.2,0.4
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: WH40KMurderMysteryKnife

- type: entity
  id: WH40KMurderMysterySheriffRevolver
  parent: BaseItem
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Revolvers/mateba.rsi
    state: icon
  - type: Item
    sprite: Objects/Weapons/Guns/Revolvers/mateba.rsi
    size: Small
    storedOffset: 0,-3
  - type: Clothing
    sprite: Objects/Weapons/Guns/Revolvers/mateba.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  - type: Gun
    fireRate: 3
    selectedMode: SemiAuto
    minAngle: 0
    maxAngle: 5
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mateba.ogg
  - type: WH40KGunPrediction
  - type: UseDelay
    delay: 0.33
  - type: AmmoCounter
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 30
    rechargeSound:
      path: /Audio/Weapons/Guns/MagIn/energycrossbow_reload.ogg
  - type: BasicEntityAmmoProvider
    proto: WH40KMurderMysterySheriffBullet
    capacity: 3
    count: 3
  - type: CombatSight
    sight:
      sprite: Interface/Misc/crosshair_pointers.rsi
      state: revolver_sight
  - type: AimingCamera
    maxOffset: 2
    pvsIncrease: 0.2
    requireWield: false
  - type: StaticPrice
    price: 0
  - type: WH40KMurderMysterySheriffRevolver

- type: entity
  id: WH40KMurderMysterySheriffBullet
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 0
  - type: WH40KMurderMysterySheriffBullet
