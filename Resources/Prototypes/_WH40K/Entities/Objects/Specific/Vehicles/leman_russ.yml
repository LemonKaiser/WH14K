- type: entity
  id: WH40KLemanRussTank
  parent: BaseStructure
  name: Leman Russ tank
  description: A multi-crew armored vehicle with a hungry engine and room for a full crew.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: false
  - type: Sprite
    sprite: _WH40K/Objects/Vehicles/leman_russ_parts.rsi
    drawdepth: Mobs
    layers:
    - map: [ "enum.WH40KTankVisualLayers.Tracks" ]
      state: tracks_static
    - state: hull
  - type: InteractionOutline
  - type: MobMover
  - type: InputMover
  - type: NoRotateOnMove
  - type: MovementSpeedModifier
    baseWalkSpeed: 0
    baseSprintSpeed: 0
  - type: Appearance
  - type: WH40KTankTrackVisualizer
    idleState: tracks_static
    movingState: tracks_moving
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.35,-1.35,1.35,1.35"
        density: 120
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 200
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 200
  - type: RefillableSolution
    solution: tank
  - type: DrainableSolution
    solution: tank
  - type: ExaminableSolution
    solution: tank
  - type: ReagentTank
    tankType: Fuel
  - type: Damageable
    damageContainer: Inorganic
  - type: Repairable
    fuelCost: 12
    doAfterDelay: 6
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 350
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: WH40KTankEngine
  - type: WH40KTankFuel
  - type: WH40KTankDrive
    forwardSpeed: 9.75
    reverseSpeed: 5.25
    turnSpeed: 4.05
    pivotTurnSpeed: 2.85
    acceleration: 13.5
    brakeDeceleration: 18
    lateralDamping: 30
    angularAcceleration: 13.5
    angularDeceleration: 18
  - type: WH40KTank
    diagnosticsAction: ActionWH40KTankDiagnostics
    hullMaxIntegrity: 350
    engineMaxIntegrity: 65
    tracksMaxIntegrity: 90
    turretMaxIntegrity: 75
    mainGunMaxIntegrity: 70
    coaxialMaxIntegrity: 50
    mainAmmoLocKey: wh40k-tank-ui-ammo-rocket-he
    coaxialAmmoLocKey: wh40k-tank-ui-ammo-heavy-bolter
    turretPrototype: WH40KLemanRussTankTurret
    turretOffset: "0.03125,-0.5625"
    turretDirectionalOffsets:
      north: "0.03125,-0.5625"
      south: "-0.03125,0.5625"
      east: "0.5625,0.03125"
      west: "-0.5625,-0.03125"
    mainHardpointPrototype: WH40KLemanRussTankBattleCannon
    mainHardpointDirectionalOffsets:
      north: "0,0.375"
      south: "0,-0.375"
      east: "0.375,0"
      west: "-0.375,0"
    mainGunPrototype: WH40KLemanRussTankBattleCannonGun
    mainGunOffset: "0,-1.375"
    coaxialHardpointPrototype: WH40KLemanRussTankCoaxialHardpoint
    coaxialHardpointOffset: "0.35,-0.45"
    coaxialGunPrototype: WH40KLemanRussTankCoaxialGun
    coaxialGunOffset: "0,-1.15"
    fireCoaxialAction: ActionWH40KTankFireCoaxial
    driverStationPrototype: WH40KLemanRussTankDriverStation
    driverStationOffset: "-0.45,0.35"
    gunnerStationPrototype: WH40KLemanRussTankGunnerStation
    gunnerStationOffset: "0.0,0.15"
    commanderStationPrototype: WH40KLemanRussTankCommanderStation
    commanderStationOffset: "0.45,-0.15"
    loaderStationPrototype: WH40KLemanRussTankLoaderStation
    loaderStationOffset: "0.8,0.35"
  - type: UserInterface
    interfaces:
      enum.WH40KTankUiKey.Key:
        type: WH40KTankBoundUserInterface

- type: entity
  id: WH40KLemanRussPunisherTank
  parent: WH40KLemanRussTank
  name: Leman Russ Punisher tank
  description: A Punisher-pattern Leman Russ built around a brutal rapid-fire main weapon.
  components:
  - type: WH40KTank
    mainHardpointPrototype: WH40KLemanRussTankPunisherCannon
    mainGunPrototype: WH40KLemanRussTankPunisherGun
    mainGunReloadSeconds: 6.25
    mainWeaponLocKey: wh40k-tank-ui-module-punisher-cannon
    mainAmmoLocKey: wh40k-tank-ui-ammo-light-rifle

