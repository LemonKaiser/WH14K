- type: entity
  id: MechSentinel
  parent: [ BaseMech, CombatMech ]
  suffix: WH40K
  description: A light Imperial scout walker with a sealed cabin and modular weapon mounts.
  components:
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: _WH40K/Objects/Specific/Mech/mecha.rsi
    layers:
    - map: [ "enum.MechVisualLayers.Base", "enum.DamageStateVisualLayers.Base", "movement"]
      state: sentinel
  - type: StatusIcon
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Mecha/sound_mecha_powerloader_step.ogg
  - type: Mech
    baseState: sentinel
    openState: sentinel-open
    brokenState: sentinel-broken
    canAirtight: true
    maxIntegrity: 300
    maxEquipmentAmount: 1
  - type: Vehicle
    transferDamageMultiplier: 0.15
  - type: SpriteMovement
    movementLayers:
      movement:
        state: sentinel-moving
    noMovementLayers:
      movement:
        state: sentinel
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.25
    baseSprintSpeed: 3.6
  - type: MeleeWeapon
    animation: WeaponArcSmash
    wideAnimation: WeaponArcSmash

- type: entity
  id: MechSentinelBatteryAutogun
  parent: MechSentinel
  suffix: Battery, WH40K, Автоган
  components:
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: _WH40K/Objects/Specific/Mech/mecha.rsi
    layers:
    - map: [ "enum.MechVisualLayers.Base", "enum.DamageStateVisualLayers.Base", "movement"]
      state: sentinel
    - state: sentinel_autogun
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh
        disableEject: true
        swap: false
  - type: Mech
    startingEquipment:
      - WeaponMechCombatSentinelRifle
    startingModules:
      - MechModuleFan
      - MechModuleAirTank
      - MechModuleTeslaRelay

- type: entity
  id: MechSentinelBatteryPlasma
  parent: MechSentinel
  suffix: Battery, WH40K, Плазма
  components:
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: _WH40K/Objects/Specific/Mech/mecha.rsi
    layers:
    - map: [ "enum.MechVisualLayers.Base", "enum.DamageStateVisualLayers.Base", "movement"]
      state: sentinel
    - state: sentinel_plasma
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh
        disableEject: true
        swap: false
  - type: Mech
    startingEquipment:
      - WeaponMechCombatSentinelPlasma
    startingModules:
      - MechModuleFan
      - MechModuleAirTank
      - MechModuleTeslaRelay
