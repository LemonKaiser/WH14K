- type: entity
  id: WH40KVehicleMotorbikeImperium
  parent: BaseVehicleMotorized
  name: imperium recon motorbike
  description: A two-seat Imperial motorbike assembled for fast frontline redeployment.
  suffix: WH40K, Fabricated
  components:
  - type: Sprite
    sprite: _WH40K/Objects/Vehicles/Motorbike/imperium_bike.rsi
    drawdepth: Objects
    noRot: false
    layers:
    - state: vehicle
      map: [ "movement" ]
  - type: SpriteMovement
    movementLayers:
      movement:
        state: vehiclemoving
    noMovementLayers:
      movement:
        state: vehicle
  - type: WH40KVehicleVisualOverlay
    overlay: WH40KVehicleMotorbikeOverlayImperium
  - type: Vehicle
    transferDamageMultiplier: 0.18
  - type: Strap
    buckleOffset: "0,0"
    modifyBuckleDrawDepth: false
    size: 200
  - type: WH40KVehicleRiderSeat
    seatOffsets:
    - "0.18,-0.10"
    - "-0.35,-0.10"
  - type: ContainerFill
    containers:
      key_slot: [ WH40KVehicleKeyMotorbikeImperium ]
  - type: GenericKeyedVehicle
    containerId: key_slot
    keyWhitelist:
      tags:
      - VehicleKey
      - WH40KImperiumMotorbikeKeys
  - type: ItemSlots
    slots:
      key_slot:
        name: vehicle-slot-component-slot-name-keys
        whitelist:
          tags:
          - VehicleKey
          - WH40KImperiumMotorbikeKeys
        insertSound:
          path: /Audio/Effects/Vehicle/vehiclestartup.ogg
          params:
            volume: -3
  - type: NoRotateOnMove
  - type: MovementSpeedModifier
    acceleration: 0
    friction: 0
    frictionNoInput: 0
    baseWalkSpeed: 0
    baseSprintSpeed: 0
  - type: WH40KVehicleCarMovement
    maxForwardSpeed: 10.2
    maxReverseSpeed: 2.7
    forwardAcceleration: 4.7
    reverseAcceleration: 2.1
    brakeDeceleration: 6.2
    coastDeceleration: 0.75
    lateralGrip: 8.8
    steerInputRate: 4.0
    steerReturnRate: 4.2
    lowSpeedTurnRateDegrees: 220
    highSpeedTurnRateDegrees: 76
    speedForFullSteer: 2.05
  - type: SolutionContainerManager
    solutions:
      vehicleFuel:
        maxVol: 900
        reagents:
        - ReagentId: WH40KPromethium
          Quantity: 900
  - type: RefillableSolution
    solution: vehicleFuel
  - type: WH40KVehicleFuel
    fuelSolution: vehicleFuel
    fuelReagent: WH40KPromethium
    fullTankRuntime: 900
  - type: WH40KVehicleEngine
    toggleAction: ActionWH40KToggleVehicleEngine
  - type: WH40KVehicleHandlingHealth
    maxDamage: 180
    wornDamage: 60
    criticalDamage: 120
    disabledDamage: 170
  - type: WH40KVehicleRam
    impactSound:
      collection: MetalThud
    softTargetDamage:
      types:
        Blunt: 12
    hardTargetDamage:
      types:
        Blunt: 18
    selfSoftImpactDamage:
      types:
        Blunt: 5
    selfHardImpactDamage:
      types:
        Blunt: 16
  - type: UnpoweredFlashlight
  - type: PointLight
    enabled: false
    radius: 3.5
    softness: 2
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 420
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 210
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          WH40KVehicleMotorbikeWreckImperium:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

