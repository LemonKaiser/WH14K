- type: entity
  id: WH40KVehicleMotorbikeOverlayImperium
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _WH40K/Objects/Vehicles/Motorbike/imperium_bike.rsi
    drawdepth: OverMobs
    noRot: false
    layers:
