- type: entity
  parent: BaseItem
  id: WH40KRuneSkrizhalBase
  name: скрижаль-руна
  description: Руническая скрижаль.
  abstract: true
  suffix: WH40K
  components:
  - type: Item
    size: Tiny
  - type: UserInterface
    interfaces:
      enum.WH40KChaosSkrizhalUiKey.PatronSelection:
        type: WH40KChaosSkrizhalBoundUserInterface
      enum.WH40KChaosSkrizhalUiKey.PatronBranch:
        type: WH40KChaosSkrizhalBranchBoundUserInterface
  - type: ItemToggle
  - type: Appearance

- type: entity
  parent: WH40KRuneSkrizhalBase
  id: WH40KRuneSkrizhalChaos
  name: скрижаль-руна Хаоса
  components:
  - type: WH40KChaosSkrizhal
    patron: Undivided
    attunementXpReward: 22
    attunementXpMultiplier: 1.15
    attunementInstabilityGain: 2.5
  - type: Sprite
    sprite: _WH40K/Interface/Abilities/skrizhali_runes.rsi
    layers:
    - state: skrizhal_chaos_tuchlo
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: skrizhal_chaos }
          False: { state: skrizhal_chaos_tuchlo }

