- type: entity
  id: WH40KServoSkull
  name: servo skull
  description: A compact servo skull chassis. Deploy it to create a friendly support skull.
  parent: BaseItem
  suffix: WH40K, non-activated
  components:
  - type: Sprite
    sprite: _WH40K/Objects/Devices/servo_skull.rsi
    state: deactivate
  - type: Item
    size: Normal
  - type: WH40KCombineWithPrototype
    requiredPrototype: MeltaGrenade
    resultPrototype: WH40KServoSkullMelta
  - type: WH40KDeployServoSkull
    mobPrototype: WH40KServoSkullMob
  - type: AmbientSound
    range: 10
    volume: -10
    sound:
       path: /Audio/Ambience/Objects/portable_scrubber.ogg

- type: entity
  id: WH40KServoSkullMelta
  name: melta servo skull
  description: A servo skull rigged with a melta charge. Deploy it and it will hunt nearby enemies for your team.
  parent: BaseItem
  suffix: WH40K, non-activated
  components:
  - type: Sprite
    sprite: _WH40K/Objects/Devices/servo_skull_melta.rsi
    state: deactivate
  - type: Item
    size: Normal
  - type: WH40KDeployServoSkull
    mobPrototype: WH40KServoSkullMeltaMob
  - type: AmbientSound
    range: 10
    volume: -10
    sound:
       path: /Audio/Ambience/Objects/portable_scrubber.ogg

- type: entity
  id: WH40KServoSkullMobBase
  abstract: true
  parent: [BaseMob, MobDamageable, MobPolymorphable, FlyingMobBase]
  name: servo skull
  description: A compact servo skull hovering on stationkeeping thrusters.
  suffix: WH40K
  components:
  - type: Physics
    bodyType: KinematicController
    bodyStatus: InAir
  - type: Damageable
    damageContainer: Inorganic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.20
        density: 20
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      25: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 4
  - type: NpcFactionMember
    factions:
    - Imperium
  - type: Tag
    tags:
    - CannotSuicide
  - type: WH40KServoSkullMob
    followSpeed: 4
    chargeSpeed: 8
    followStopRange: 1.25
    chargeStopRange: 0.25
    hostileDetectionRange: 6
    scanInterval: 0.2
  - type: AmbientSound
    range: 10
    volume: -10
    sound:
       path: /Audio/Ambience/Objects/portable_scrubber.ogg

- type: entity
  id: WH40KServoSkullMob
  parent: WH40KServoSkullMobBase
  name: servo skull
  description: A friendly servo skull awaiting a command.
  suffix: WH40K
  components:
  - type: Sprite
    drawdepth: Mobs
    noRot: false
    sprite: _WH40K/Objects/Devices/servo_skull.rsi
    state: icon

- type: entity
  id: WH40KServoSkullSlaanesh
  parent: WH40KServoSkull
  name: servo skull
  description: A friendly servo skull awaiting a command.
  suffix: WH40K, Слаанеш, non-activated
  components:
  - type: Sprite
    sprite: _WH40K/Objects/Devices/servo_skull_slaanesh.rsi
    state: deactivate
  - type: Item
    size: Normal
  - type: WH40KCombineWithPrototype
    requiredPrototype: MeltaGrenade
    resultPrototype: WH40KServoSkullMelta
  - type: WH40KDeployServoSkull
    mobPrototype: WH40KServoSkullMobSlaanesh

- type: entity
  id: WH40KServoSkullMobSlaanesh
  parent: WH40KServoSkullMobBase
  name: servo skull
  description: A friendly servo skull awaiting a command.
  suffix: WH40K, Слаанеш
  components:
  - type: HandheldLight
    addPrefix: true
    blinkingBehaviourId: blinking
    radiatingBehaviourId: radiating
  - type: LightBehaviour
    behaviours:
      - !type:FadeBehaviour
        id: radiating
        maxDuration: 2.0
        startValue: 3.0
        endValue: 2.0
        isLooped: true
        reverseWhenFinished: true
      - !type:PulseBehaviour
        id: blinking
        interpolate: Nearest
        maxDuration: 1.0
        startValue: 0.1
        endValue: 2.0
        isLooped: true
  - type: ItemTogglePointLight
  - type: PointLight
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    radius: 7
    color: "#d32dff"
  - type: Battery
    maxCharge: 2000
    startingCharge: 2000
    pricePerJoule: 0.15
  - type: BatterySelfRecharger
    autoRechargeRate: 10
  - type: Sprite
    drawdepth: Mobs
    noRot: false
    sprite: _WH40K/Objects/Devices/servo_skull_slaanesh.rsi
    state: icon

- type: entity
  id: WH40KServoSkullMeltaMob
  parent: WH40KServoSkullMobBase
  name: melta servo skull
  description: A friendly servo skull carrying a live melta charge.
  suffix: WH40K
  components:
  - type: Sprite
    drawdepth: Mobs
    noRot: false
    sprite: _WH40K/Objects/Devices/servo_skull_melta.rsi
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: Appearance
  - type: AnimationPlayer
  - type: GenericVisualizer
    visuals:
      enum.Trigger.TriggerVisuals.VisualState:
        enum.TriggerVisualLayers.Base:
          Primed: { state: primed }
          Unprimed: { state: icon }
  - type: WH40KServoSkullMob
    triggerOnHostile: true
    followSpeed: 4.5
    chargeSpeed: 9
    hostileDetectionRange: 7
    scanInterval: 0.15
  - type: TimerTrigger
    delay: 3
  - type: ExplodeOnTrigger
    keysIn:
    - timer
  - type: Explosive
    explosionType: MicroBomb
    totalIntensity: 90
    intensitySlope: 45
    maxIntensity: 10
    canCreateVacuum: false
  - type: TimerTriggerVisuals
    primingSound:
      path: /Audio/Items/smoke_grenade_prime.ogg
  - type: AmbientSound
    range: 10
    volume: -10
    sound:
       path: /Audio/Ambience/Objects/portable_scrubber.ogg
