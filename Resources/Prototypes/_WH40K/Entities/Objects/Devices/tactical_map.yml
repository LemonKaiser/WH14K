- type: entity
  id: WH40KTacticalMapScannerEye
  name: tactical map scanner eye
  categories: [ HideSpawnMenu ]
  suffix: Hidden
  components:
    - type: Eye

- type: entity
  id: WH40KBaseTacticalMapDevice
  abstract: true
  components:
    - type: WH40KTacticalMap
      initializeWithStation: true
      snapshotTexture: /Textures/_WH40K/Interface/TacticalMap/battlefield40k_snapshot.png
      fogEnabled: true
      fogChunkSize: 8
      fogRevealRadiusChunks: 0
      liveRefreshEnabled: false
      liveRefreshChunkSize: 16
      liveRefreshInterval: 2.5
      liveRefreshPvsScale: 1.0

- type: entity
  id: WH40KBaseTacticalMapTablet
  parent:
    - WH40KBaseTacticalMapDevice
    - BaseHandheldComputer
  abstract: true
  components:
    - type: Sprite
      sprite: Objects/Devices/tablets.rsi
      layers:
        - state: tablet
        - state: generic
          shader: unshaded
    - type: ActivatableUI
      inHandsOnly: true
      singleUser: true
      key: enum.WH40KTacticalMapUiKey.Key
    - type: Damageable
      damageContainer: Inorganic
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 100
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
    - type: UserInterface
      interfaces:
        enum.WH40KTacticalMapUiKey.Key:
          type: WH40KTacticalMapBoundUserInterface

- type: entity
  id: WH40KBaseTacticalMapConsole
  parent:
    - WH40KBaseTacticalMapDevice
    - BaseStructure
  abstract: true
  components:
    - type: Animateable
    - type: InteractionOutline
    - type: Rotatable
    - type: Physics
      bodyType: Static
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.25,-0.35,0.25,0.35"
          density: 190
          mask:
            - MachineMask
          layer:
            - MachineLayer
    - type: Computer
    - type: ApcPowerReceiver
      powerLoad: 50
    - type: PowerState
      idlePowerDraw: 50
      workingPowerDraw: 500
    - type: UIPowerState
    - type: ExtensionCableReceiver
    - type: ActivatableUIRequiresPower
    - type: Sprite
      sprite: _WH40K/Structures/Specific/mapimp.rsi
      layers:
        - map: ["computerLayerBody"]
          state: computer
        - map: ["computerLayerScreen"]
          state: decorative_monitor
          shader: unshaded
    - type: Icon
      sprite: _WH40K/Structures/Specific/mapimp.rsi
      state: computer
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.ComputerVisuals.Powered:
          computerLayerScreen:
            True: { visible: true, shader: unshaded }
            False: { visible: false }
        enum.WiresVisuals.MaintenancePanelState:
          enum.WiresVisualLayers.MaintenancePanel:
            True: { visible: false }
            False: { visible: true }
    - type: LitOnPowered
    - type: PointLight
      radius: 1.5
      energy: 3.0
      enabled: false
      mask: /Textures/Effects/LightMasks/cone.png
      autoRot: true
      offset: "0, 0.4"
      castShadows: false
    - type: EmitSoundOnUIOpen
      sound:
        collection: Keyboard
        params:
          volume: -1
          variation: 0.10
          pitch: 1.10
      blacklist:
        tags:
          - NoConsoleSound
    - type: ContainerContainer
      containers:
        board: !type:Container
          ents: []
    - type: LightningTarget
      priority: 1
    - type: RequireProjectileTarget
    - type: Electrified
      enabled: false
      usesApcPower: true
    - type: WiresPanel
    - type: WiresVisuals
    - type: Wires
      boardName: wires-board-name-computer
      layoutId: Computer
    - type: ActivatableUI
      singleUser: true
      key: enum.WH40KTacticalMapUiKey.Key
    - type: UserInterface
      interfaces:
        enum.WH40KTacticalMapUiKey.Key:
          type: WH40KTacticalMapBoundUserInterface
        enum.WiresUiKey.Key:
          type: WiresBoundUserInterface

- type: entity
  id: WH40KCommandTacticalMapTablet
  parent:
    - WH40KBaseTacticalMapTablet
  suffix: Handheld, Command

- type: entity
  id: WH40KStandardTacticalMapTablet
  parent:
    - WH40KBaseTacticalMapTablet
  suffix: Handheld, Standard
  components:
    - type: WH40KTacticalMap
      canAnnotate: false

- type: entity
  id: WH40KCommandTacticalMapConsole
  parent: WH40KBaseTacticalMapConsole
  suffix: Console, Command

- type: entity
  id: WH40KStandardTacticalMapConsole
  parent: WH40KBaseTacticalMapConsole
  suffix: Console, Standard
  components:
    - type: WH40KTacticalMap
      canAnnotate: false

- type: entity
  id: WH40KCommandTacticalMapConsoleImperium
  parent: WH40KCommandTacticalMapConsole
  suffix: Console, Command, Imperium

- type: entity
  id: WH40KCommandTacticalMapConsoleHeretics
  parent: WH40KCommandTacticalMapConsole
  suffix: Console, Command, Heretics
  components:
    - type: Sprite
      sprite: _WH40K/Structures/Specific/mapchaos.rsi
      layers:
        - map: ["computerLayerBody"]
          state: computer
        - map: ["computerLayerScreen"]
          state: decorative_monitor
          shader: unshaded
    - type: Icon
      sprite: _WH40K/Structures/Specific/mapchaos.rsi
      state: computer

- type: entity
  id: WH40KStandardTacticalMapConsoleImperium
  parent: WH40KStandardTacticalMapConsole
  suffix: Console, Standard, Imperium

- type: entity
  id: WH40KStandardTacticalMapConsoleHeretics
  parent: WH40KStandardTacticalMapConsole
  suffix: Console, Standard, Heretics
  components:
    - type: Sprite
      sprite: _WH40K/Structures/Specific/mapchaos.rsi
      layers:
        - map: ["computerLayerBody"]
          state: computer
        - map: ["computerLayerScreen"]
          state: decorative_monitor
          shader: unshaded
    - type: Icon
      sprite: _WH40K/Structures/Specific/mapchaos.rsi
      state: computer
