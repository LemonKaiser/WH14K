- type: entity
  id: WH40KTauGunDrone
  name: tau gun drone
  description: A compact Tau support drone that can follow its owner and engage nearby hostiles.
  parent: BaseItem
  suffix: WH40K, Tau
  components:
  - type: Sprite
    sprite: _WH40K/Objects/Devices/tau_gun_drone.rsi
    state: deactivate
  - type: Item
    size: Normal
  - type: WH40KDeployServoSkull
    mobPrototype: WH40KTauGunDroneMob
    startFollowingOwner: true
  - type: AmbientSound
    range: 10
    volume: -10
    sound:
      path: /Audio/Ambience/Objects/portable_scrubber.ogg

- type: entity
  id: WH40KTauGunDroneMob
  parent: WH40KServoSkullMobBase
  name: tau gun drone
  description: A hovering Tau combat drone awaiting orders.
  suffix: WH40K, Tau
  components:
  - type: Sprite
    drawdepth: Mobs
    noRot: false
    sprite: _WH40K/Objects/Devices/tau_gun_drone.rsi
    state: icon
  - type: NpcFactionMember
    factions:
    - Tau
  - type: WH40KServoSkullMob
    followSpeed: 4.8
    chargeSpeed: 5.4
    followStopRange: 0.55
    chargeStopRange: 0.8
    hostileDetectionRange: 10
    triggerOnHostile: false
    scanInterval: 0.1
  - type: WH40KTauGunDrone
    fireRange: 8
    acquisitionRange: 10
    ownerLeashRange: 10
    followFormationRadius: 1.15
    combatFormationRadius: 4.5
    minimumCombatRange: 2.8
    preferredCombatRange: 4.5
    scanInterval: 0.1
  - type: BatteryAmmoProvider
    proto: WH40KTauGunDroneBeam
    fireCost: 100
  - type: Battery
    maxCharge: 2400
    startingCharge: 2400
    pricePerJoule: 0.15
  - type: BatterySelfRecharger
    autoRechargeRate: 100
  - type: Gun
    fireRate: 1
    useKey: false
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser3.ogg
