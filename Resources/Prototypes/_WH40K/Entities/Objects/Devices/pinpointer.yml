- type: entity
  id: WH40KMissionPinpointerKitImperium
  parent: BoxCardboard
  name: imperium mission pinpointer kit
  description: Command kit with relay, cargo, and banner mission pinpointers.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: WH40KMissionPinpointerRelayImperium
