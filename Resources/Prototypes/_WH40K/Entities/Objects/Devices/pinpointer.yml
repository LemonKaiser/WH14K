- type: entity
  id: WH40KMissionPinpointerBase
  parent: PinpointerBase
  abstract: true
  name: mission pinpointer
  description: A mission-calibrated tracker for active frontline objectives.
  components:
  - type: Pinpointer
    closeDistance: 18
    mediumDistance: 42
    reachedDistance: 2
    updateTargetName: false
    canRetarget: false
  - type: WH40KMissionPinpointer
    requireTeam: true
    trackGlobalMissionFallback: true
    refreshInterval: 1

- type: entity
  id: WH40KMissionPinpointerRelayImperium
  parent: WH40KMissionPinpointerBase
  name: imperium relay pinpointer
  description: Tracks active relay-control sectors assigned to Imperium command.
  components:
  - type: WH40KMissionPinpointer
    preset: Relay
    allowedTeamIds:
    - Imperium
    noMissionTargetName: No active relay mission
    noTeamTargetName: Imperium team identity is not resolved
    unauthorizedTargetName: Restricted to Imperium mission command

