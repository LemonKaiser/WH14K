- type: entity
  id: WH40KInflatableWallStackImperium
  parent: BaseItem
  name: imperium inflatable wall pack
  description: Folded rapid-deploy barrier for front-line engineers.
  suffix: Full
  components:
  - type: Stack
    stackType: WH40KInflatableWallImperium
    count: 8
  - type: Sprite
    sprite: _WH40K/Objects/Misc/inflatable_wall.rsi
    state: folded_wall
  - type: Item
    sprite: _WH40K/Objects/Misc/inflatable_wall.rsi
    size: Small
  - type: UseDelay
    delay: 1.2
  - type: WH40KInflatableDeploy
    deployPrototype: WH40KInflatableWallImperium
    deployDoAfter: 1
    itemCooldown: 1.2
    userCooldown: 0.6
    deployWindow: 20
    maxDeploysPerWindow: 8
    maxActiveDeployables: 12
    requireTeam: true
    allowedTeamIds:
    - Imperium
  - type: Clickable
  - type: PhysicalComposition
  - type: Tag
    tags:
    - Inflatable

- type: entity
  id: WH40KInflatableWallStackImperium1
  parent: WH40KInflatableWallStackImperium
  suffix: 1
  components:
  - type: Stack
    count: 1

