- type: entity
  name: Hormagaunt Timed Spawner
  id: HormagauntTimedSpawner
  parent: MarkerBase
  suffix: WH40K, periodic
  components:
    - type: Sprite
      layers:
        - state: blue
        - state: hormagaunt
          sprite: _WH40K/Mobs/hormagaunt.rsi
        - state: timed
    - type: TimedSpawner
      prototypes:
        - MobHormagaunt
      # round ~90m
      # one spawner should only spawn ~5 mice for sanity reasons
      # therefore 18m
      # use 50% chance for randomness and balance with halved interval
      chance: 0.75
      intervalSeconds: 180
      minimumEntitiesSpawned: 1
      maximumEntitiesSpawned: 1
