- type: entityTable
  id: WH40KHereticObjectiveStrikeSquadTable
  table: !type:AllSelector
    children:
    - id: MobWH40KWaveTestHereticObjectiveLeader
      amount: !type:ConstantNumberSelector
        value: 1
    - id: MobWH40KWaveTestHereticObjectiveCoordinator
      amount: !type:ConstantNumberSelector
        value: 1
    - id: MobWH40KWaveTestHereticObjectiveSapper
      amount: !type:ConstantNumberSelector
        value: 1
    - id: MobWH40KWaveTestHereticObjectiveSoldier
      amount: !type:ConstantNumberSelector
        value: 4

- type: entity
  parent: MarkerBase
  id: SpawnWH40KHereticObjectiveStrikeSquadMarker
  name: heretic objective strike squad marker
  categories: [ HideSpawnMenu, Spawner ]
  components:
  - type: WH40KEntityTableSpawnOnStartup
    offset: 1.1
    deleteSpawnerAfterSpawn: true
    table: !type:NestedSelector
      tableId: WH40KHereticObjectiveStrikeSquadTable

- type: entity
  parent: MarkerBase
  id: SpawnWH40KHereticObjectiveStrikePoint
  name: WH40K heretic objective strike point
  suffix: WH40K, NPC, Timed Squad
  components:
  - type: Sprite
    layers:
    - state: red
    - state: icon
      sprite: Objects/Weapons/Guns/Rifles/ak.rsi
  - type: TimedSpawner
    prototypes:
    - SpawnWH40KHereticObjectiveStrikeSquadMarker
    chance: 1
    intervalSeconds: 90
    minimumEntitiesSpawned: 1
    maximumEntitiesSpawned: 1
