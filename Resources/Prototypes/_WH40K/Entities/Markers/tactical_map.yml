- type: entity
  id: WH40KTacticalMapBlackoutMarker
  name: Tactical Map Mask
  suffix: Enabled
  parent: MarkerBase
  components:
  - type: SetWH40KTacticalMapBlackout
    value: true
  - type: Sprite
    layers:
    - state: green
      shader: unshaded

- type: entity
  id: WH40KNoTacticalMapBlackoutMarker
  name: Tactical Map Mask
  suffix: Disabled
  parent: MarkerBase
  components:
  - type: SetWH40KTacticalMapBlackout
    value: false
  - type: Sprite
    layers:
    - state: red
      shader: unshaded
