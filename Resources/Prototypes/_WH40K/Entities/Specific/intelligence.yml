- type: entity
  name: чип данных
  parent: BaseItem
  id: DataChip
  suffix: WH40K
  description: Чип, вероятно, содержащий в себе очень важные разведданные. За них можно получить дополнительное снаряжение!
  components:
  - type: Sprite
    scale: 0.8,0.8
    sprite: _WH40K/Objects/Specific/intelligence.yml
    state: datachip
    layers:
    - state: datachip
      map: ["base"]
  - type: Item
    size: Small
  - type: Stack
    stackType: DataChip
    count: 1
    baseLayer: base
    layerStates:
    - datachip
    - datachip_2
    - datachip_3
    - datachip_4
    layerFunction: Threshold
  - type: StackLayerThreshold
    thresholds: [ 2, 3, 4 ]
  - type: Currency
    price:
      Intelligence: 2
  - type: Appearance
  
- type: entity
  name: чип хаоса
  parent: DataChip
  id: DataChipChaos
  suffix: WH40K
  description: Осквернённый чип, полный данных, являющихся весьма полезными для ваших покровителей. Они могут оказать вам милость, если вы пожертвуете эти чипы.
  components:
  - type: Sprite
    scale: 0.8,0.8
    sprite: _WH40K/Objects/Specific/intelligence.yml
    state: datachip
    layers:
    - state: chaoschip
      map: ["base"]
  - type: Stack
    stackType: DataChip
    count: 1
    baseLayer: base
    layerStates:
    - chaoschip
    - chaoschip_2
    - chaoschip_3
    - chaoschip_4
