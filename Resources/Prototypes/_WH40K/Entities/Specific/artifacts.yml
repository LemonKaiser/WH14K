- type: entity
  parent: BaseItem
  id: WH40KArtifactSquare
  categories: [ HideSpawnMenu ]
  suffix: WH40K
  components:
  - type: Sprite
    sprite: _WH40K/Objects/Specific/artifact_square.rsi
    layers:
    - state: artifact
      map: ["base"]
  - type: Item
    size: Small
  - type: Stack
    stackType: WH40KArtifactSquare
    count: 1
    baseLayer: base
    layerStates:
    - artifact
    - artifact_2
    - artifact_3
    - artifact_4
    layerFunction: Threshold
  - type: StackLayerThreshold
    thresholds: [ 2, 3, 4 ]
  - type: StackPrice
    price: 1
  - type: Currency
    price:
      artifact_imp: 1
  - type: Appearance

