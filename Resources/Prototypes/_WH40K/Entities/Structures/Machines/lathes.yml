- type: entity
  id: WH40KBaseLatheMachine
  parent: BaseStructure
  abstract: true
  components:
  - type: Animateable
  - type: InteractionOutline
  - type: Appearance
  - type: WiresVisuals
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
          - MachineLayer
  - type: Lathe
  - type: MaterialStorage
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: WiresPanel
  - type: ActivatableUI
    key: enum.LatheUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.LatheUiKey.Key:
        type: LatheBoundUserInterface
      enum.ResearchClientUiKey.Key:
        type: ResearchClientBoundUserInterface
  - type: Pullable
  - type: StaticPrice
    price: 800
  - type: ResearchClient
  - type: TechnologyDatabase
  - type: ApcPowerReceiver
    powerLoad: 150
  - type: ExtensionCableReceiver
  - type: LightningTarget
    priority: 1
  - type: PowerState
    idlePowerDraw: 150
    workingPowerDraw: 1000

- type: entity
  id: WH40KAutolathe
  parent: WH40KBaseLatheMachine
  name: autolathe
  suffix: WH40K
  components:
  - type: Sprite
    sprite: _WH40K/Structures/Machines/autolathe.rsi
    snapCardinals: true
    offset: 0.5,0
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Lathe
    idleState: icon
    runningState: building
    unlitIdleState: unlit
    unlitRunningState: unlit-building
    staticPacks:
    - WH40KAutolatheStockEmpty
  - type: Machine
    board: AutolatheMachineCircuitboard
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
  - type: OreSiloClient
  - type: EmagLatheRecipes
    emagStaticPacks:
    - SecurityAmmoStatic
    - SyndicateAmmoStatic
  - type: BlueprintReceiver
    whitelist:
      tags:
      - BlueprintAutolathe
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      blueprint: !type:Container
  - type: EmptyOnMachineDeconstruct
    containers:
    - blueprint

- type: entity
  id: WH40KAutolatheImperium
  parent: WH40KAutolathe
  name: autolathe
  suffix: WH40K, Imperium
  components:
  - type: Lathe
    staticPacks:
    - WH40KAutolatheStatic
  - type: WH40KTieredLatheProcessing
    teamId: Imperium
    tierMachineProfile: WH40KTierMachineStandard
    tier0Pack: WH40KAutolatheStatic
    tier1Pack: WH40KAutolatheTier1
    tier2Pack: WH40KAutolatheTier2
    tier3Pack: WH40KAutolatheTier3
    remapQueueToSelectedTierPack: false
  - type: WH40KResearchTeam
    teamId: Imperium
  - type: Machine
    board: AutolatheMachineCircuitboardImperium

- type: entity
  id: WH40KAutolatheHeretics
  parent: WH40KAutolathe
  name: autolathe
  suffix: WH40K, Heretics
  components:
  - type: Lathe
    staticPacks:
    - WH40KAutolatheStatic
  - type: WH40KTieredLatheProcessing
    teamId: Heretics
    tierMachineProfile: WH40KTierMachineStandard
    tier0Pack: WH40KAutolatheStatic
    tier1Pack: WH40KAutolatheTier1
    tier2Pack: WH40KAutolatheTier2
    tier3Pack: WH40KAutolatheTier3
    remapQueueToSelectedTierPack: false
  - type: WH40KResearchTeam
    teamId: Heretics
  - type: Machine
    board: AutolatheMachineCircuitboardHeretics

- type: entity
  id: WH40KProtolathe
  parent: WH40KBaseLatheMachine
  name: protolathe
  suffix: WH40K
  components:
  - type: Sprite
    sprite: _WH40K/Structures/Machines/protolathe.rsi
    offset: 0,0.5
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Lathe
    idleState: icon
    runningState: building
    producingSound: /Audio/_WH40K/Machines/protolathe.ogg
    unlitIdleState: unlit
    unlitRunningState: unlit-building
    staticPacks:
    - WH40KProtolatheStockEmpty
    dynamicPacks: []
  - type: Machine
    board: ProtolatheMachineCircuitboard
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
  - type: OreSiloClient
  - type: EmagLatheRecipes
    emagStaticPacks:
    - SecurityAmmo
    - SecurityExplosives
    - SecurityEquipment
    - SecurityWeapons

- type: entity
  id: WH40KProtolatheImperium
  parent: WH40KProtolathe
  name: protolathe
  suffix: WH40K, Imperium
