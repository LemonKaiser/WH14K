    tierMachineProfile: WH40KTierMachineStandard
    tier0Pack: WH40KProtolatheStatic
    tier1Pack: WH40KProtolatheTier1
    tier2Pack: WH40KProtolatheTier2
    tier3Pack: WH40KProtolatheTier3
    remapQueueToSelectedTierPack: false
  - type: WH40KResearchTeam
