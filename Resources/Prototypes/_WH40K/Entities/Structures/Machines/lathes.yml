    staticPacks:
    - WH40KOreProcessorVanillaFull
  - type: WH40KTieredLatheProcessing
    teamId: Imperium
    tierMachineProfile: WH40KTierMachineStandard
    tier0Pack: WH40KOreProcessorVanillaFull
    tier1Pack: WH40KOreProcessorVanillaFull
    tier2Pack: WH40KOreProcessorVanillaFull
    tier3Pack: WH40KOreProcessorVanillaFull
    remapQueueToSelectedTierPack: false
  - type: WH40KResearchTeam
