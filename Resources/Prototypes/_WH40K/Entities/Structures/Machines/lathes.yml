- type: entity
  id: WH40KOreProcessor
  parent: WH40KBaseLatheMachine
  name: ore processor
  suffix: WH40K
  components:
  - type: Sprite
    sprite: _WH40K/Structures/Machines/ore_processor.rsi
    offset: 0.5,0.5
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,1.49,1.49"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Lathe
    idleState: icon
    runningState: building
    defaultProductionAmount: 10
    producingSound: !type:SoundPathSpecifier
      path: /Audio/_WH40K/Machines/MCRW.ogg
      params:
        volume: -10
    staticPacks:
    - WH40KOreProcessorStockEmpty
  - type: Machine
    board: OreProcessorMachineCircuitboard
  - type: MaterialStorage
    ignoreColor: true
    whitelist:
      tags:
      - Ore

- type: entity
  id: WH40KOreProcessorImperium
  parent: WH40KOreProcessor
  name: ore processor
  suffix: WH40K, Imperium
  components:
