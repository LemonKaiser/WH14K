  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
      enum.WH40KVehicleFabricationUiKey.Key:
        type: WH40KVehicleFabricationBoundUserInterface
  - type: CargoOrderConsole
    account: WH40KHeretics
    mode: SendToPrimary
    allowedGroups:
    - WH40KHereticsVehicleMarket
  - type: MaterialStorage
    storageLimit: 2000
  - type: WH40KVehicleFabricationConsole
    queueCapacity: 4
    assemblyPadRange: 8
    recipes:
    - WH40KHereticsVehicleMotorbikeRecipe
