- type: entity
  id: ShuttleComputerModular
  parent: [BaseComputer, BaseMachinePowered]
  name: терминал управления
  description: Терминал, используемый для управления кораблём и поддержания связи.
  suffix: WH40K
  placement:
   mode: AlignTileAny
  components:
  - type: SpriteFade
  - type: Sprite
    sprite: _WH40K/Structures/Machines/modular_computer.rsi
    drawdepth: Mobs
    offset: 0,0.4
    layers:
    - state: base
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
      visible: false
    - state: unshaded
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      visible: false
    - state: inserting
      visible: false
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
  - type: AmbientSound
    range: 5
    volume: -10
    sound:
      path: /Audio/Ambience/Objects/emf_buzz.ogg
  - type: PointLight
    radius: 5
    energy: 1.6
    color: "#339b1c"
  - type: Transform
    anchored: true
  - type: LitOnPowered
  - type: ApcPowerReceiver
    powerLoad: 50
  - type: ExtensionCableReceiver
  - type: Physics
    bodyType: Static
  - type: CommunicationsConsole
    title: comms-console-announcement-title-station
  - type: DeviceNetwork
    transmitFrequencyId: ShuttleTimer
  - type: ActivatableUIRequiresPower
  - type: ActivatableUI
    key: enum.CommunicationsConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.CommunicationsConsoleUiKey.Key:
        type: CommunicationsConsoleBoundUserInterface
  - type: Computer
    board: CommsComputerCircuitboard
  - type: MaterialStorage
    whitelist:
      tags:
        - Sheet
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.5,-0.5,1.5,1.4"
        density: 50
        mask:
        - LargeMobMask
        layer:
        - WallLayer
  - type: Repairable
    fuelCost: 10
    doAfterDelay: 5
  - type: WiresPanel
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: ["Breakage"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
      enum.AnomalyGeneratorVisuals.Generating:
        enum.AnomalyGeneratorVisualLayers.Base:
          True: { visible: true }
          False: { visible: false }
  - type: WiresVisuals

- type: entity
  id: AdMechComputerModular
  parent: [BaseComputer, BaseMachinePowered]
  name: терминал
  description: Терминал, используемый для технических работ.
  suffix: WH40K
  placement:
    mode: AlignTileAny
  components:
  - type: Sprite
    sprite: _WH40K/Structures/Machines/admech_modular_computer.rsi
    offset: 0.5,0
    layers:
    - state: base
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
      visible: false
    - state: unshaded
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      visible: false
    - state: inserting
      visible: false
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
  - type: SpriteFade
  - type: AmbientSound
    range: 5
    volume: -10
    sound:
      path: /Audio/Ambience/Objects/emf_buzz.ogg
  - type: PointLight
    radius: 5
    energy: 1.6
    color: "#339b1c"
  - type: Transform
    anchored: true
  - type: LitOnPowered
  - type: ApcPowerReceiver
    powerLoad: 50
  - type: ExtensionCableReceiver
  - type: Physics
    bodyType: Static
  - type: ActivatableUIRequiresPower
  - type: Computer
    board: PowerComputerCircuitboard
  - type: PowerMonitoringConsole
  - type: PowerMonitoringCableNetworks
  - type: NodeContainer
    examinable: true
    nodes:
      hv:
        !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: ActivatableUI
    singleUser: true
    key: enum.PowerMonitoringConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.PowerMonitoringConsoleUiKey.Key:
        type: PowerMonitoringConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: MaterialStorage
    whitelist:
      tags:
        - Sheet
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.2,1.1,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
          - MachineLayer
  - type: Repairable
    fuelCost: 10
    doAfterDelay: 5
  - type: WiresPanel
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: ["Breakage"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
      enum.AnomalyGeneratorVisuals.Generating:
        enum.AnomalyGeneratorVisualLayers.Base:
          True: { visible: true }
          False: { visible: false }
  - type: WiresVisuals
