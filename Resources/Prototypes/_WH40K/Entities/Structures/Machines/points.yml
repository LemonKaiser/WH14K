- type: entity
  id: WH40KBasePointLathe
  parent: BaseStructure
  abstract: true
  components:
  - type: Animateable
  - type: InteractionOutline
  - type: Appearance
  - type: WiresVisuals
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
          - MachineLayer
  - type: Lathe
  - type: MaterialStorage
  - type: WiresPanel
  - type: ActivatableUI
    key: enum.LatheUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.LatheUiKey.Key:
        type: LatheBoundUserInterface
      enum.ResearchClientUiKey.Key:
        type: ResearchClientBoundUserInterface
  - type: Pullable
  - type: StaticPrice
    price: 800
  - type: ResearchClient
  - type: TechnologyDatabase
  - type: ApcPowerReceiver
    powerLoad: 150
  - type: ExtensionCableReceiver
  - type: LightningTarget
    priority: 1
  - type: PowerState
    idlePowerDraw: 150
    workingPowerDraw: 1000

- type: entity
  id: ImpPointLathe
  parent: WH40KBasePointLathe
  suffix: WH40K, Imperium
  components:
  - type: Sprite
    sprite: _WH40K/Structures/Machines/data_conventer.rsi
    offset: 0,0.5
    noRot: true
    layers:
    - state: icon
    - state: unshaded
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
  - type: Lathe
    idleState: icon
    runningState: building
    staticPacks:
    - DataChipsForImp
  - type: WH40KTieredLatheProcessing
    teamId: Imperium
    tierMachineProfile: WH40KTierMachineStandard
    tier0Pack: DataChipsForImp
    tier1Pack: DataChipsForImpTier1
    tier2Pack: DataChipsForImpTier2
    tier3Pack: DataChipsForImpTier3
  - type: SpriteFade

- type: entity
  id: ChPointLathe
  parent: WH40KBasePointLathe
  suffix: WH40K, Heretics
  components:
  - type: Sprite
    sprite: _WH40K/Structures/Machines/data_conventer_ch.rsi
    offset: 0,0.5
    noRot: true
    layers:
    - state: icon
    - state: unshaded
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
  - type: Lathe
    idleState: icon
    runningState: building
    staticPacks:
    - DataChipsForCh
  - type: WH40KTieredLatheProcessing
    teamId: Heretics
    tierMachineProfile: WH40KTierMachineStandard
    tier0Pack: DataChipsForCh
    tier1Pack: DataChipsForChTier1
    tier2Pack: DataChipsForChTier2
    tier3Pack: DataChipsForChTier3
  - type: SpriteFade
