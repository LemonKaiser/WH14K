- type: entity
  parent: BaseStructure
  id: MachineChipProduser
  suffix: WH40K
  components:
  - type: Sprite
    sprite: _WH40K/Structures/Machines/data_chip_producer.rsi
    offset: 0,1
    noRot: true
    layers:
    - state: base
    - state: unshaded
      shader: unshaded
  - type: AmbientSound
    range: 10
    volume: -5
    sound:
       path: /Audio/Ambience/Objects/periodic_beep.ogg
  - type: PointLight
    radius: 3
    energy: 0.3
    color: "#b3f02e"
  - type: NavMapBeacon
    color: "#ff0000"
    text: Capture point
  - type: WH40KInfluencePoint
    captureRadius: 2.67
    captureTimeSeconds: 20
    captureEnabledFromPhase: Assault
    rewardIntervalSeconds: 120
    frontPointsPerInterval: 1
  - type: SpriteFade

- type: entity
  parent: MachineChipProduser
  id: MachineChipProduserCenter
  suffix: WH40K, Center
  components:
  - type: WH40KInfluencePoint
    captureRadius: 3
    captureTimeSeconds: 30
    captureEnabledFromPhase: Assault
    rewardIntervalSeconds: 120
    frontPointsPerInterval: 2

- type: entity
  id: WH40KBasePointLathe
  parent: BaseStructure
  abstract: true
  components:
  - type: Animateable
  - type: InteractionOutline
  - type: Appearance
  - type: WiresVisuals
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
          - MachineLayer
  - type: Lathe
  - type: MaterialStorage
  - type: WiresPanel
  - type: ActivatableUI
    key: enum.LatheUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.LatheUiKey.Key:
        type: LatheBoundUserInterface
      enum.ResearchClientUiKey.Key:
        type: ResearchClientBoundUserInterface
  - type: Pullable
  - type: StaticPrice
    price: 800
  - type: ResearchClient
  - type: TechnologyDatabase
  - type: ApcPowerReceiver
    powerLoad: 150
  - type: ExtensionCableReceiver
  - type: LightningTarget
    priority: 1
  - type: PowerState
    idlePowerDraw: 150
    workingPowerDraw: 1000

- type: entity
  id: ImpPointLathe
  parent: WH40KBasePointLathe
  suffix: WH40K, Imperium
  components:
  - type: Sprite
    sprite: _WH40K/Structures/Machines/data_conventer.rsi
    offset: 0,0.5
    noRot: true
    layers:
    - state: icon
    - state: unshaded
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
  - type: Lathe
    idleState: icon
    runningState: building
    staticPacks:
    - DataChipsForImp
  - type: WH40KTieredLatheProcessing
    teamId: Imperium
    tierMachineProfile: WH40KTierMachineStandard
    tier0Pack: DataChipsForImp
    tier1Pack: DataChipsForImpTier1
    tier2Pack: DataChipsForImpTier2
    tier3Pack: DataChipsForImpTier3
  - type: SpriteFade

- type: entity
  id: MachineChipProduserImperiumOwned
  parent: MachineChipProduser
  suffix: WH40K, Империум-владение
  components:
  - type: WH40KInfluencePoint
    ownerTeamId: Imperium
    captureRadius: 2.67
    captureTimeSeconds: 20
    captureEnabledFromPhase: Assault
    rewardIntervalSeconds: 120
    frontPointsPerInterval: 1

- type: entity
  id: MachineChipProduserHereticsOwned
  parent: MachineChipProduser
  suffix: WH40K, Еретики-владение
  components:
  - type: WH40KInfluencePoint
    ownerTeamId: Heretics
