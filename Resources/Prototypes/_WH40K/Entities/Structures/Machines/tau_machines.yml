- type: entity
  id: WH40KAutolatheTau
  parent: WH40KAutolathe
  name: autolathe
  suffix: WH40K, Tau
  components:
  - type: Sprite
    sprite: _WH40K/Structures/Machines/tau_autolathe.rsi
    snapCardinals: true
    offset: 0.5,0
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Lathe
    staticPacks:
    - WH40KAutolatheStaticTau
  - type: WH40KTieredLatheProcessing
    teamId: Tau
    tierMachineProfile: WH40KTierMachineStandard
    tier0Pack: WH40KAutolatheStaticTau
    tier1Pack: WH40KAutolatheTier1Tau
    tier2Pack: WH40KAutolatheTier2Tau
    tier3Pack: WH40KAutolatheTier3Tau
    remapQueueToSelectedTierPack: false
  - type: WH40KResearchTeam
    teamId: Tau
  - type: Machine
    board: AutolatheMachineCircuitboardTau

