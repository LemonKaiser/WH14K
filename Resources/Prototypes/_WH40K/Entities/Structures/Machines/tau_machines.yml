- type: entity
  id: WH40KComputerResearchAndDevelopmentTau
  parent: WH40KBaseResearchAndDevelopmentComputer
  name: tau R&D computer
  suffix: WH40K, Tau
  components:
  - type: Sprite
    sprite: _WH40K/Structures/Machines/tau_modular_computer.rsi
    drawdepth: Mobs
    offset: 0,0.4
    layers:
    - state: base
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
      visible: false
    - state: unshaded
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      visible: false
    - state: inserting
      visible: false
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
  - type: WH40KResearchTeam
    teamId: Tau
  - type: AccessReader
    access: []
