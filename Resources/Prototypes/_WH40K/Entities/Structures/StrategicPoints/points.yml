- type: entity
  parent: WH40KStrategicPointInfluenceT1Base
  id: WH40KStrategicPointInfluenceT1
  suffix: WH40K, Strategic Point, Influence, T1
  components:
  - type: WH40KStrategicPointTurretTierGate
    requiredTier: 3
    turretEnabledOnMatch: true
    turretEnabledOffMatch: false
  - type: CombatMode
  - type: HTN
    enabled: true
    rootTask:
      task: WH40KPointTurretCompound
    blackboard:
      RotateSpeed: !type:Single
        3.141
      SoundTargetInLOS: !type:SoundPathSpecifier
        path: /Audio/Effects/double_beep.ogg
  - type: Gun
    fireRate: 0.5
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_WH40K/Weapons/Guns/Gunshots/stubber_fire_1.wav
  - type: BallisticAmmoProvider
    proto: BulletBolter
    capacity: 30
    whitelist:
      tags:
      - CartridgeBolter75
  - type: BallisticAmmoSelfRefiller
    autoRefillRate: 1s
    firingPausesAutoRefill: true
    autoRefillPauseDuration: 1s
  - type: WH40KTurretProfile
    detectionRange: 14
    fireRange: 14
    supportedAmmo: CartridgeBolter75
  - type: DeployableTurret
    enabled: false
  - type: WH40KStrategicPointOwnerFactionBinder
    imperiumFaction: Imperium
    hereticsFaction: Heretics
    imperiumTeamId: Imperium
    hereticsTeamId: Heretics
  - type: TurretTargetSettings
    exemptAccessLevels:
    - Borg
    - BasicSilicon
  - type: WH40KTurretGlobalActivationLock
  - type: NpcFactionMember
  - type: WH40KGunPrediction
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container

