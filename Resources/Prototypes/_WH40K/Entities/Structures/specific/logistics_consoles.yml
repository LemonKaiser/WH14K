# ── Reinforcement Consoles ──────────────────────────────────────────────

- type: entity
  parent: BaseStructure
  id: StructureLogisticsConsoleImperiumReinforcement
  name: imperium reinforcement terminal
  description: Reinforcement request terminal for imperial command.
  suffix: "WH40K, Imperium, Reinforcement Terminal"
  components:
  - type: Sprite
    sprite: _WH40K/Structures/Specific/reinforcementsimp.rsi
    drawdepth: SmallObjects
    layers:
    - state: computer
    - state: decorative_monitor
      shader: unshaded
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 200
        mask:
        - TabletopMachineMask
        layer:
        - TabletopMachineLayer
  - type: UserInterface
    interfaces:
      enum.WH40KCommandNodeUiKey.Reinforcement:
        type: WH40KReinforcementConsoleBoundUserInterface
  - type: ActivatableUI
    key: enum.WH40KCommandNodeUiKey.Reinforcement
  - type: WH40KCommandNode
    teamId: Imperium
    passiveFrontPointsPerInterval: 0
  - type: SpriteFade

