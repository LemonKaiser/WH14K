- type: entity
  parent: BaseStructure
  id: StructureLogisticsConsoleTauBuy
  name: tau logistics console
  description: Cargo-order console for Tau requisitions.
  suffix: "WH40K, Tau, Cargo Console"
  components:
  - type: Sprite
    sprite: _WH40K/Structures/Specific/taubuy.rsi
    layers:
    - state: computer
    - state: decorative_monitor
      shader: unshaded
  - type: UserInterface
    interfaces:
      enum.CargoConsoleUiKey.Orders:
        type: CargoOrderConsoleBoundUserInterface
  - type: ActivatableUI
    key: enum.CargoConsoleUiKey.Orders
  - type: CargoOrderConsole
    account: WH40KTau
    baseTransferLimit: 0
    allowedGroups:
    - WH40KTauMarket
  - type: CargoBatchOrderConsole
    batchDelaySeconds: 300
  - type: WH40KStoreTeam
    teamId: Tau
  - type: SpriteFade

- type: entity
  parent: WH40KBaseFieldCommandConsole
  id: StructureLogisticsConsoleTauCmd
  name: tau command terminal
  description: Strategic command terminal for Tau control.
  suffix: "WH40K, Tau, Command Terminal"
  components:
  - type: Sprite
    sprite: _WH40K/Structures/Machines/Computers/srttau.rsi
    drawdepth: LargeObjects
    layers:
    - map: [ "computerLayerBody" ]
      state: computer
    - map: [ "computerLayerScreen" ]
      state: computer_on
      shader: unshaded
      visible: true
  - type: Icon
    sprite: _WH40K/Structures/Machines/Computers/srttau.rsi
    state: computer
  - type: UserInterface
    interfaces:
      enum.WH40KCommandNodeUiKey.Key:
        type: WH40KCommandNodeBoundUserInterface
  - type: ActivatableUI
    key: enum.WH40KCommandNodeUiKey.Key
  - type: WH40KCommandNode
    teamId: Tau
    passiveFrontPointsPerInterval: 2

- type: entity
  parent: BaseStructure
  id: StructureLogisticsConsoleTauSell
  name: tau logistics sale console
  description: Cargo-sale console for Tau logistics.
  suffix: "WH40K, Tau, Cargo Sell Console"
  components:
  - type: Sprite
    sprite: _WH40K/Structures/Specific/selltau.rsi
    layers:
    - state: computer
    - state: decorative_monitor
      shader: unshaded
  - type: UserInterface
    interfaces:
      enum.CargoPalletConsoleUiKey.Sale:
        type: CargoPalletConsoleBoundUserInterface
  - type: ActivatableUI
    key: enum.CargoPalletConsoleUiKey.Sale
  - type: CargoPalletConsole
  - type: WH40KStoreTeam
    teamId: Tau
  - type: SpriteFade

- type: entity
  parent: BaseStructure
  id: StructureLogisticsConsoleTauReinforcement
  name: tau reinforcement terminal
  description: Reinforcement request terminal for Tau command.
  suffix: "WH40K, Tau, Reinforcement Terminal"
  components:
  - type: Sprite
    sprite: _WH40K/Structures/Specific/reinforcementstau.rsi
    drawdepth: LargeObjects
    layers:
    - state: computer
    - state: decorative_monitor
      shader: unshaded
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 200
        mask:
        - TabletopMachineMask
        layer:
        - TabletopMachineLayer
  - type: UserInterface
    interfaces:
      enum.WH40KCommandNodeUiKey.Reinforcement:
        type: WH40KReinforcementConsoleBoundUserInterface
  - type: ActivatableUI
    key: enum.WH40KCommandNodeUiKey.Reinforcement
  - type: WH40KCommandNode
    teamId: Tau
    passiveFrontPointsPerInterval: 0
  - type: SpriteFade

