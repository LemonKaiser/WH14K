- type: entity
  parent: [BaseStructure, StorePresetAltar]
  id: StructureAltar
  name: алтарь хаоса
  description: "Алтарь, на котором за разведданые тёмные боги могут наградить вас, или же ближайшая крепость фабрика. Кажется, оно шевелится..."
  suffix: "WH40K, Хаос"
  components:
    - type: Sprite
      sprite: _WH40K/Structures/Specific/altar.rsi
      state: Altar_Idol1
    - type: AmbientSound
      enabled: true
      volume: -3
      range: 5
      sound:
        path: /Audio/_WH40K/Machines/altar.ogg
    - type: UserInterface
      interfaces:
        enum.StoreUiKey.Key:
          type: StoreBoundUserInterface
    - type: ActivatableUI
      key: enum.StoreUiKey.Key
    - type: Store
      balance:
        intelligence_ch: 0
    - type: InteractionOutline

