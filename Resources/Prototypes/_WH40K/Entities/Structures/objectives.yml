- type: entity
  id: WH40KObjectiveBase
  parent: BaseStructure
  abstract: true
  components:
  - type: Sprite
    sprite: _WH40K/Structures/Specific/imperium_throne.rsi
    drawdepth: OverMobs
    layers:
    - state: base
      offset: 0, 0.5
      map: [ "enum.WH40KObjectiveVisualLayers.Base" ]
    - sprite: Effects/sparks.rsi
      state: sparks
      visible: false
      shader: unshaded
      map: [ "enum.WH40KObjectiveVisualLayers.Destroying" ]
  - type: Appearance
  - type: WH40KAlwaysShowHealthBar
    maxHealth: 2000
    useMobThresholds: false
    barWidthPixels: 72
    barHeightPixels: 9
    yOffsetSpritePercent: 0.2
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask:
        - MachineMask
        layer:
        - Opaque
        - MidImpassable
        - LowImpassable
        - BulletImpassable
  - type: GenericVisualizer
    visuals:
      enum.WH40KObjectiveVisuals.State:
        enum.WH40KObjectiveVisualLayers.Base:
          Intact: { state: base }
          Destroying: { state: breaking }
          Destroyed: { state: broken }
        enum.WH40KObjectiveVisualLayers.Destroying:
          Intact: { visible: false }
          Destroying: { visible: true }
          Destroyed: { visible: false }
  - type: InteractionOutline
  - type: Damageable
    damageContainer: Inorganic
    healthBarThreshold: 0
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      2000: Dead
    triggersAlerts: false
    showOverlays: false
  - type: WH40KObjective
    teamId: Imperium
    name: wh40k-objective-base-name
    maxHealth: 2000
    warnAtPercent: 0.5
    destructionDelaySeconds: 3
    triggerKey: wh40k-objective-destroyed
  - type: TimerTrigger
    keyOut: wh40k-objective-destroyed
    delay: 3
    popup: null
    examinable: false
  - type: EmitSoundOnTrigger
    keysIn: [ wh40k-objective-destroyed ]
    sound:
      collection: MetalBreak
  - type: SpawnOnTrigger
    keysIn: [ wh40k-objective-destroyed ]
    proto: EffectSparks
    useMapCoords: true

- type: entity
  id: WH40KObjectiveImperium
  parent: WH40KObjectiveBase
  suffix: WH40K, Imperium
  components:
  - type: WH40KObjective
    teamId: Imperium
    name: wh40k-objective-imperium-name

- type: entity
  id: WH40KObjectiveHeretics
  parent: WH40KObjectiveBase
  suffix: WH40K, Heretics
  components:
  - type: WH40KObjective
    teamId: Heretics
    name: wh40k-objective-heretics-name
  - type: Sprite
    sprite: _WH40K/Structures/Specific/chaos_throne.rsi
    drawdepth: OverMobs
    layers:
    - state: base
      offset: 0, 0.5
      map: [ "enum.WH40KObjectiveVisualLayers.Base" ]
    - sprite: Effects/sparks.rsi
      state: sparks
      visible: false
      shader: unshaded
      map: [ "enum.WH40KObjectiveVisualLayers.Destroying" ]

