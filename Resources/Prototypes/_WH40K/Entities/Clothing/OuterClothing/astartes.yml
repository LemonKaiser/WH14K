- type: entity
  parent: ClothingOuterArmorBasic
  id: ClothingOuterArmorAstartesMk7
  name: силовая броня Mk VII "Аквила"
  description: Сервоусиленный комплект силовой брони Адептус Астартес. Защищает лучше обычной панцирной брони и рассчитан на тело космодесантника.
  suffix: WH40K, Astartes
  components:
  - type: Sprite
    sprite: _WH40K/Clothing/OuterClothing/Armor/astartes_mk7.rsi
    layers:
    - state: icon
      color: "#2F5DB3"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#2F5DB3"
      right:
      - state: inhand-right
        color: "#2F5DB3"
  - type: Clothing
    sprite: _WH40K/Clothing/OuterClothing/Armor/astartes_mk7.rsi
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING
        color: "#2F5DB3"
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.3
        Slash: 0.3
        Piercing: 0.35
        Heat: 0.45
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.01
    coolingCoefficient: 0.01
  - type: ExplosionResistance
    damageCoefficient: 0.45
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: SpeciesRestrictedClothing
    species:
    - Astartes
    popup: species-restricted-clothing-component-astartes-only

