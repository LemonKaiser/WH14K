  description: Тёмная шинель, пропитанная символами Хаоса. Она внушает страх своим видом.
  suffix: WH40K, Культ Хаоса
  components:
  - type: Sprite
    sprite: _WH40K/Clothing/OuterClothing/Coats/overcoat.rsi
