- type: entity
  abstract: true
  parent: ClothingBackpack
  id: ClothingBackpackAstartesBase
  suffix: WH40K, Astartes
  components:
  - type: Sprite
    layers:
    - state: icon
      color: "#2F5DB3"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#2F5DB3"
      right:
      - state: inhand-right
        color: "#2F5DB3"
  - type: Clothing
    clothingVisuals:
      back:
      - state: equipped-BACKPACK
        color: "#2F5DB3"
  - type: SpeciesRestrictedClothing
    species:
    - Astartes
    popup: species-restricted-clothing-component-astartes-only

