- type: entity
  parent: ClothingBackpack
  id: ClothingBackpackTau
  suffix: WH40K, Tau
  components:
  - type: Sprite
    sprite: _WH40K/Clothing/Back/Backpacks/tau_backpack.rsi
  - type: Clothing
    sprite: _WH40K/Clothing/Back/Backpacks/tau_backpack.rsi
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
      cell_slot: !type:ContainerSlot
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMicroreactor
        whitelist:
          tags:
          - PowerCell
          - PowerCellSmall
  - type: EnergyDomeGenerator
    enabledOnSpawn: false
    globalEnabled: false
    damageEnergyDraw: 5
    domePrototype: EnergyDomeSmallBlue
    useModeProfiles: true
    useSizeColorProfiles: false
    useAutoResponseProfiles: false
    mode: Bubble
    size: Small
    color: Blue
    wallSide: Front
    autoResponseProfile: HoldLine
    bubbleDomePrototype: EnergyDomeSmallBlue
    wallDomePrototype: EnergyDomeSmallBlueDirected
    activationEnergyCost: 14
    passiveEnergyDraw: 1.2
    impactEnergyDrawMultiplier: 1.0
    bubbleCostMultiplier: 1.0
    wallCostMultiplier: 0.62
    wallForwardOffset: 1.0
    heatImpactMultiplier: 1.10
    piercingImpactMultiplier: 1.20
    otherImpactMultiplier: 1.0
    burstWindow: 0.60
    burstStepMultiplier: 0.15
    burstMaxMultiplier: 1.95
    stressEnabled: true
    stressPerDamage: 0.0105
    stressDecayPerSecond: 0.09
    stressDecayInactiveMultiplier: 1.45
    stressImpactEnergyMultiplier: 0.75
    stressPassiveEnergyMultiplier: 0.50
    stressBreakThreshold: 1.00
    stressWarningThreshold: 0.62
    teamId: Tau
    interiorRadiusMultiplier: 1.0
    linkEnabled: false
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.EnergyDomeUiKey.Key:
        type: EnergyDomeBoundUserInterface
  - type: PowerCellDraw
    enabled: false
    drawRate: 0
