- type: entity
  parent: ClothingMaskGas
  id: ClothingMaskGasCultist3
  name: респиратор культиста
  description: Зловещий респиратор, украшенный символами Хаоса. Он защищает дыхательные пути и лишь изредка смягчает удары по лицу за счет твердого каркаса.
  suffix: WH40K, Культ Хаоса
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _WH40K\Clothing\Mask\respirator_cult.rsi
  - type: Clothing
    sprite: _WH40K\Clothing\Mask\respirator_cult.rsi
  - type: HideLayerClothing
    slots:
    - Snout
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.97        # почти весь урон проходит
        Slash: 0.97        # слабая защита от рубящего
        Piercing: 0.98     # минимальная защита от колющего
        Heat: 0.95         # чуть-чуть от огня
        Radiation: 0.85    # заметно лучше против радиации