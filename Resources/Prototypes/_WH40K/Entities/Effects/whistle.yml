- type: entity
  id: WH40KWhistlePulseMarkerBase
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 12
  - type: Transform
    anchored: true
    noRot: true
  - type: Sprite
    drawdepth: Effects
    noRot: true
    layers:
    - shader: unshaded
      sprite: _RMC14/Effects/alert.rsi
      state: techpod_lz_marker
      color: "#8ED9FFEE"
  - type: PointLight
    enabled: true
    radius: 1.8
    softness: 1
    color: "#8ED9FF"
    energy: 1.3
  - type: WH40KMissionObjectiveVisual
    label: wh40k-whistle-marker-label-regroup
    radius: 6
    pulse: true
    color: "#8ED9FF"
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: WH40KWhistlePulseRegroupMarker
  parent: WH40KWhistlePulseMarkerBase
  name: regroup pulse marker
  description: A temporary regroup pulse marker.
  components:
  - type: WH40KMissionObjectiveVisual
    label: wh40k-whistle-marker-label-regroup
    radius: 6
    color: "#8ED9FF"

- type: entity
  id: WH40KWhistlePulseAttackMarker
  parent: WH40KWhistlePulseMarkerBase
  name: attack pulse marker
  description: A temporary attack pulse marker.
  components:
  - type: Sprite
    layers:
    - shader: unshaded
      sprite: _RMC14/Effects/alert.rsi
      state: techpod_lz_marker
      color: "#FF6C6CEE"
  - type: PointLight
    color: "#FF6C6C"
  - type: WH40KMissionObjectiveVisual
    label: wh40k-whistle-marker-label-attack
    radius: 5.5
    color: "#FF6C6C"

- type: entity
  id: WH40KWhistlePulseRetreatMarker
  parent: WH40KWhistlePulseMarkerBase
  name: retreat pulse marker
  description: A temporary retreat pulse marker.
  components:
  - type: Sprite
    layers:
    - shader: unshaded
      sprite: _RMC14/Effects/alert.rsi
      state: techpod_lz_marker
      color: "#FFD07AEE"
  - type: PointLight
    color: "#FFD07A"
  - type: WH40KMissionObjectiveVisual
    label: wh40k-whistle-marker-label-retreat
    radius: 5.5
    color: "#FFD07A"
