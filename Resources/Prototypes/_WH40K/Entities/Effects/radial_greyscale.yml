- type: entity
  id: WH40KRadialGreyscaleField
  name: radial greyscale field
  description: Converts world colors to grayscale inside a radial area.
  components:
  - type: Sprite
    drawdepth: Effects
    noRot: true
    sprite: _RMC14/Effects/alert.rsi
    layers:
    - state: alert_greyscale
      color: "#9ac6ff99"
  - type: PointLight
    enabled: true
    radius: 2.5
    energy: 0.6
    color: "#8dbfff"
  - type: WH40KRadialGreyscale
    radius: 2
    feather: 0.35
  - type: WH40KTimeDilationField
    movementSpeedMultiplier: 0.7
    meleeAttackRateMultiplier: 0.7
    physicsVelocityMultiplier: 0.7
    timedDespawnMultiplier: 0.7
    grenadeFuseTimerMultiplier: 0.7
