- type: entity
  id: WH40KWaveDefenceChaosHumanoidBase
  parent: MobHuman
  abstract: true
  suffix: WH40K, WaveDefence, Chaos
  components:
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: NpcFactionMember
    factions:
    - Heretics
  - type: WH40KTeamMember
    teamId: Heretics
  - type: CombatMode
  - type: Tool
    speedModifier: 2
    qualities:
    - Prying
  - type: Prying
    pryPowered: !type:Bool
      true
    force: !type:Bool
      true
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: HTN
    rootTask:
      task: WH40KWaveDefenceAdvancedHumanoidHostileCompound
