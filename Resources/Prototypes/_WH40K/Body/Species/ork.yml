- type: entity
  parent: AppearanceHuman
  id: AppearanceOrk
  categories: [ HideSpawnMenu ]
  name: Ork appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganOrkTorso
      Head: OrganOrkHead
      ArmLeft: OrganOrkArmLeft
      ArmRight: OrganOrkArmRight
      HandRight: OrganOrkHandRight
      HandLeft: OrganOrkHandLeft
      LegLeft: OrganOrkLegLeft
      LegRight: OrganOrkLegRight
      FootLeft: OrganOrkFootLeft
      FootRight: OrganOrkFootRight
      Brain: OrganHumanBrain
      Eyes: OrganOrkEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Ork

- type: entity
  parent:
  - AppearanceOrk
  - MobHuman
  id: MobOrk
  suffix: WH40K, Орки
  components:
  - type: DamageVisuals
    thresholds: [ 8, 16, 24, 40, 56, 80 ]
    targetLayers:
    - "enum.HumanoidVisualLayers.Chest"
    - "enum.HumanoidVisualLayers.Head"
    - "enum.HumanoidVisualLayers.LArm"
    - "enum.HumanoidVisualLayers.LLeg"
    - "enum.HumanoidVisualLayers.RArm"
    - "enum.HumanoidVisualLayers.RLeg"
    damageOverlayGroups:
      Brute:
        sprite: _WH40K/Mobs/Species/Ork/brute_damage.rsi
        color: "#FF0000"
      Burn:
        sprite: _WH40K/Mobs/Species/Ork/burn_damage.rsi
  - type: SlowOnDamage
    speedModifierThresholds:
      180: 0.7
      240: 0.5
  - type: Bloodstream
    bleedReductionAmount: 1
    maxBleedAmount: 30
    bloodRefreshAmount: 3
    bleedPuddleThreshold: 3
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 900
  - type: Stamina
    baseCritThreshold: 300
    animationThreshold: 150
    forceStandStamina: 30
  - type: MobThresholds
    thresholds:
      0: Alive
      145: Critical
      240: Dead
  - type: MeleeWeapon
    damage:
      types:
        Slash: 40
        Structural: 20
  - type: PassiveDamage
    allowedStates:
    - Alive
    - Critical
    damage:
      types:
        Heat: -0.35
        Blunt: -0.25
        Piercing: -0.25
        Slash: -0.25
  - type: NpcFactionMember
    factions:
    - Orks

- type: entity
  parent: OrganHuman
  id: OrganOrk
  abstract: true
  suffix: Ork

- type: entity
  parent: OrganOrk
  id: OrganOrkExternal
  abstract: true
  components:
