    thresholds: [ 8, 16, 24, 40, 56, 80 ]
    targetLayers:
    - "enum.HumanoidVisualLayers.Chest"
    - "enum.HumanoidVisualLayers.Head"
    - "enum.HumanoidVisualLayers.LArm"
    - "enum.HumanoidVisualLayers.LLeg"
    - "enum.HumanoidVisualLayers.RArm"
    - "enum.HumanoidVisualLayers.RLeg"
    damageOverlayGroups:
      Brute:
        sprite: _WH40K/Mobs/Species/Tau/brute_damage.rsi
        color: "#FF0000"
      Burn:
        sprite: _WH40K/Mobs/Species/Tau/burn_damage.rsi
  - type: SlowOnDamage
    speedModifierThresholds:
      48: 0.7
      64: 0.5
  - type: MobThresholds
    thresholds:
      0: Alive
      80: Critical
      160: Dead
  - type: Stamina
    baseCritThreshold: 80
    animationThreshold: 40
  - type: ScaleVisuals
    scale: 1, 0.95
  - type: NpcFactionMember
    factions:
    - Tau

