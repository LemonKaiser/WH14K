    teamId: Imperium
    title: Omnissiah Convoy
    description: Deliver a critical tech shipment from neutral zone to Imperium command node.
    baseWeight: 1.0
    durationSeconds: 420
    tags: [imperium, convoy, logistics]
  - id: imp_vox_litany_relay
    scope: Faction
    teamId: Imperium
    title: Vox Litany Relay
    description: Activate and hold an Imperial relay until full signal uplink.
