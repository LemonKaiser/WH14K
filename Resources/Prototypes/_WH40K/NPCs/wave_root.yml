# A1 root compounds that map each wave-defense role to its dedicated role compound.

- type: htnCompound
  id: WH40KWaveAssaultRoot
  branches:
    - tasks:
        - !type:HTNCompoundTask
          task: WH40KWaveAssaultRoleCompound
    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound

