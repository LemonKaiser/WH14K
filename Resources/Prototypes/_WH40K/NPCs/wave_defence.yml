- type: htnCompound
  id: WH40KWaveDefencePlayerInnateRangedCombatCompound
  branches:
    - preconditions:
        - !type:GunAmmoPrecondition
          minPercent: 0.001
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:WH40KWaveDefencePickPlayerTargetOperator
            targetKey: WH40KWavePlayerTarget
            targetCoordinatesKey: WH40KWavePlayerTargetCoordinates
        - !type:HTNCompoundTask
          task: WH40KWaveDefencePlayerGunAttackTargetCompound

- type: htnCompound
  id: WH40KWaveDefenceObjectiveRangedAttackCompound
  branches:
    - preconditions:
        - !type:GunAmmoPrecondition
          minPercent: 0.001
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:WH40KWaveDefencePickObjectiveOperator
            targetKey: WH40KWaveObjectiveTarget
            targetCoordinatesKey: WH40KWaveObjectiveTargetCoordinates
            maxDistance: 10.5
            requireLineOfSight: false
        - !type:HTNCompoundTask
          task: WH40KWaveDefenceObjectiveGunAttackTargetCompound

- type: htnCompound
  id: WH40KWaveDefencePlayerRangedCombatCompound
  branches:
    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
            - type: Gun
        - !type:GunAmmoPrecondition
          minPercent: 0.001
        - !type:NeedToRackBoltPrecondition
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:RackBoltOperator
    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
            - type: Gun
        - !type:WieldedPrecondition
          wielded: false
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:WieldOperator
    - preconditions:
        - !type:GunAmmoPrecondition
          minPercent: 0.001
      tasks:
        - !type:HTNCompoundTask
          task: WH40KWaveDefencePlayerInnateRangedCombatCompound
    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
            - type: Gun
          invert: true
      tasks:
        - !type:HTNCompoundTask
          task: PickupGunCompound
    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
            - type: Gun
        - !type:GunAmmoPrecondition
          maxPercent: 0.001
      tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:ActiveHandEntityPrecondition
          operator: !type:DropOperator

- type: htnCompound
  id: WH40KWaveDefenceAIProfileSimpleSwarm
  branches:
    - tasks:
        - !type:HTNCompoundTask
          task: WH40KWaveDefencePlayerInnateRangedCombatCompound
    - tasks:
        - !type:HTNCompoundTask
          task: WH40KWaveDefencePlayerMeleeCombatCompound
    - tasks:
        - !type:HTNCompoundTask
          task: WH40KWaveDefenceObjectiveRangedAttackCompound
    - tasks:
        - !type:HTNCompoundTask
          task: WH40KWaveDefenceObjectiveMeleeAttackCompound
    - tasks:
        - !type:HTNCompoundTask
          task: WH40KWaveDefenceAdvanceCompound
    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound

