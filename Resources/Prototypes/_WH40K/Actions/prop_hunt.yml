- type: entity
  parent: BaseAction
  id: ActionWH40KPropHuntMorph
  name: wh40k-prop-hunt-action-morph-name
  description: wh40k-prop-hunt-action-morph-desc
  components:
  - type: Action
    icon:
      sprite: Objects/Devices/chameleon_projector.rsi
      state: icon
    useDelay: 60
    checkCanInteract: true
  - type: TargetAction
    checkCanAccess: true
    range: 3
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:WH40KPropHuntMorphActionEvent

