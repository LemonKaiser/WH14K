- type: entity
  parent: BaseAction
  id: ActionWH40KPropHuntMorph
  components:
  - type: Action
    icon:
      sprite: Objects/Devices/chameleon_projector.rsi
      state: icon
    useDelay: 60
    checkCanInteract: true
  - type: TargetAction
    checkCanAccess: false
    range: 3
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:WH40KPropHuntMorphActionEvent

