- type: entity
  parent: BaseAction
  id: ActionWH40KTankFireCoaxial
  name: Fire coaxial bolter
  description: Queue the coaxial bolter to fire when the turret is aligned.
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 0.35
    icon:
      sprite: _WH40K/Objects/Weapons/Guns/Bolters/heavy_bolter_emplacement.rsi
      state: heavy_bolter
    checkCanInteract: false
  - type: InstantAction
    event: !type:WH40KTankFireCoaxialActionEvent

- type: entity
  parent: BaseAction
  id: ActionWH40KTankReloadMainGun
  name: Reload main gun
  description: Cycle a fresh shell or magazine into the main weapon.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _WH40K/Objects/Vehicles/leman_russ_parts.rsi
      state: battlecannon
    checkCanInteract: false
  - type: InstantAction
    event: !type:WH40KTankReloadMainGunActionEvent

- type: entity
  parent: BaseAction
  id: ActionWH40KTankReloadCoaxial
  name: Reload coaxial feed
  description: Replenish the coaxial weapon feed.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _WH40K/Objects/Weapons/Guns/Bolters/heavy_bolter_emplacement.rsi
      state: heavy_bolter
    checkCanInteract: false
  - type: InstantAction
    event: !type:WH40KTankReloadCoaxialActionEvent

- type: entity
  parent: BaseAction
  id: ActionWH40KTankDiagnostics
  name: Open diagnostics
  description: Review crew stations, subsystem integrity, and fuel state.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _WH40K/Objects/Vehicles/leman_russ_parts.rsi
      state: hull
    checkCanInteract: false
  - type: InstantAction
    event: !type:OpenUiActionEvent
      key: enum.WH40KTankUiKey.Key
