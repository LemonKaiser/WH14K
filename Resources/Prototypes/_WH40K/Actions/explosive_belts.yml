- type: entity
  parent: BaseAction
  id: ActionWH40KChaosDynamiteBeltShort
  name: Взвести пояс с динамитом (1с)
  description: Активировать пояс Хаоса на мгновенный подрыв.
  components:
  - type: Action
    icon:
      sprite: _WH40K/Clothing/Belt/chaos_dynamite_belt.rsi
      state: icon
    itemIconStyle: BigItem
    checkCanInteract: false
  - type: InstantAction
    event: !type:WH40KActivateExplosiveBeltActionEvent
      delaySeconds: 1

