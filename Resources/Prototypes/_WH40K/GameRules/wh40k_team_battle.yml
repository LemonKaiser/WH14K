- type: entity
  id: WH40KTeamBattle
  parent: BaseGameRule
  components:
  - type: WH40KTeamBattleRule
    objectivesEnabled: true
    victoryCondition: Either # victoryCondition: Teams | Objectives | Either | None
    roundTimeLimitSeconds: 10800
    preparationDurationSeconds: 600
    assaultDurationSeconds: 3600
    earlyVictoryLockSeconds: 0
    configProfile: WH40KTeamBattleConfig120m
    teams:
    - id: Imperium
      name: wh40k-team-imperium
      color: "#FFD200"
      balanceGroup: main
      cargoAccount: WH40KImperium
      npcFaction: Imperium
      logo:
        sprite: _WH40K/Structures/Decorations/banners.rsi
        state: gvardia_banner
      departments: [ Imperium, Mechanicus ]
    - id: Heretics
      name: wh40k-team-heretics
      color: "#D62828"
      balanceGroup: main
      cargoAccount: WH40KHeretics
      npcFaction: Heretics
      logo:
        sprite: _WH40K/Structures/Decorations/banners.rsi
        state: chaos_banner
      departments: [ Heretics, DarkMechanicum ]
    - id: Tau
      name: wh40k-team-tau
      color: "#F4F4F4"
      balanceGroup: ""
      maxPlayers: 10
      sameFactionStreakLimit: 2
      requiredForPresence: false
      cargoAccount: WH40KTau
      npcFaction: Tau
      logo:
        sprite: _WH40K/Structures/Decorations/banners.rsi
        state: tau_banner
      departments: [ Tau ]
      recruitment:
        enabled: true
        rewardMultiplier: 3
