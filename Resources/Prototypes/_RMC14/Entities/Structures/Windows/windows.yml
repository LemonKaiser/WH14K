- type: entity
  abstract: true
  parent: CMBaseStructureCorrodible
  id: CMBaseWindowIndestructible
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    drawdepth: Walls
  - type: PlacementReplacement
    key: walls
  - type: Airtight
  - type: RadiationBlocker
    resistance: 2
  - type: StaticPrice
    price: 75
  - type: Physics
    bodyType: Static
  - type: InteractionPopup
    interactDelay: 10
    interactSuccessString: comp-window-knock
    messagePerceivedByOthers: rmc-window-knock-others
    interactSuccessSound:
      path: /Audio/Effects/glass_knock.ogg
      params:
        variation: 0.125
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000

- type: entity
  abstract: true
  parent: CMBaseWindowIndestructible
  id: CMBaseWindow # TODO RMC14 this needs to be 2 separate entities eventually
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmack
  - type: Damageable
    damageModifierSet: StructuralMarine
  - type: Injurable
    damageContainer: StructuralMarine

- type: entity
  parent: CMBaseWindowIndestructible
  id: CMWindowReinforcedAlmayerHull
  name: hull window
  description: A glass window with a special rod matrix inside a wall frame. This one was made out of exotic materials to prevent hull breaches. No way to get through here.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Windows/almayer_window.rsi
    state: alm_rwindow0
  - type: Icon
    sprite: _RMC14/Structures/Windows/almayer_window.rsi
    state: alm_rwindow0
  - type: IconSmooth
    key: windows
    additionalKeys:
    - doors
    base: alm_rwindow
    mode: CardinalFlags

