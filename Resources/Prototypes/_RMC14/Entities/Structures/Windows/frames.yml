- type: entity
  abstract: true
  parent: CMBaseStructureCorrodible
  id: RMCBaseWindowFrame
  name: window frame
  description: A big hole in the wall that used to sport a large window. Can be vaulted through.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    drawdepth: Walls
  - type: PlacementReplacement
    key: walls
  - type: Damageable
    damageModifierSet: StructuralMetallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: StaticPrice
    price: 75
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 1000
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - BulletImpassable
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 600
        behaviors:
          - !type:DoActsBehavior
            acts: ["Destruction"]
          - !type:SpawnEntitiesBehavior
            spawn:
              SheetSteel1:
                min: 2
                max: 2
  - type: InteractionOutline
  - type: Clickable
  - type: Climbable
  - type: Tag
    tags:
    - Structure
    - WindowFrame

- type: entity
  parent: RMCBaseWindowFrame
  id: RMCWindowFrameAlmayer
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Windows/Frames/almayer_frame.rsi
    state: alm_frame0
  - type: Icon
    sprite: _RMC14/Structures/Windows/Frames/almayer_frame.rsi
    state: alm_frame0
  - type: IconSmooth
    key: windows
    additionalKeys:
    - doors
    base: alm_frame
    mode: CardinalFlags

