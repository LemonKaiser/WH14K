- type: entity
  parent: CMBaseWindow
  id: RMCWindowSPPReinforced
  name: military grade window
  description: A glass window. Light refracts incorrectly when looking through. It looks rather strong. Might take a few good hits to shatter it.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Windows/spp_window.rsi
    state: uppwall_window0
  - type: Icon
    sprite: _RMC14/Structures/Windows/spp_window.rsi
    state: uppwall_window0
  - type: IconSmooth
    key: walls
    base: uppwall_window
    mode: CardinalFlags
  - type: Repairable
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 600 # excessive damage destroys window and frame
        behaviors:
          - !type:PlaySoundBehavior
            sound:
              collection: WindowShatter
          - !type:DoActsBehavior
            acts: ["Destruction"]
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
          - !type:PlaySoundBehavior
            sound:
              collection: WindowShatter
          - !type:SpawnEntitiesBehavior
            spawn:
              ShardGlass:
                min: 1
                max: 1
              PartRodMetal1:
                min: 1
                max: 1

