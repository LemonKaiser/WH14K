- type: entity
  parent: RMCBaseWindowFrame
  id: RMCWindowFrameStrata
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Windows/Frames/strata_frame.rsi
    state: strata_frame0
  - type: Icon
    sprite: _RMC14/Structures/Windows/Frames/strata_frame.rsi
    state: strata_frame0
  - type: IconSmooth
    key: windows
    additionalKeys:
    - doors
    base: strata_frame
    mode: CardinalFlags

- type: entity
  parent: RMCWindowFrameColonyReinforced
  id: RMCWindowFrameStrataReinforced
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Windows/Frames/strata_frame.rsi
    state: strata_frame0
  - type: Icon
    sprite: _RMC14/Structures/Windows/Frames/strata_frame.rsi
    state: strata_frame0
  - type: IconSmooth
    key: windows
    additionalKeys:
    - doors
    base: strata_frame
    mode: CardinalFlags

- type: entity
  parent: CMBaseWindow
  id: RMCWindowStrata
  name: window
  description: A glass window inside a wall frame.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Windows/strata_window.rsi
    state: strata_window0
  - type: Icon
    sprite: _RMC14/Structures/Windows/strata_window.rsi
    state: strata_window0
  - type: IconSmooth
    key: windows
    additionalKeys:
    - doors
    base: strata_window
    mode: CardinalFlags
  - type: Repairable
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 600 # excessive damage destroys window and frame
        behaviors:
          - !type:PlaySoundBehavior
            sound:
              collection: WindowShatter
          - !type:DoActsBehavior
            acts: ["Destruction"]
      - trigger:
          !type:DamageTrigger
          damage: 40
        behaviors:
          - !type:PlaySoundBehavior
            sound:
              collection: WindowShatter
          - !type:SpawnEntitiesBehavior
            spawn:
              ShardGlass:
                min: 1
                max: 1

- type: entity
  parent: CMBaseWindow
  id: RMCWindowStrataReinforced
  name: reinforced window
  description: A glass window. Light refracts incorrectly when looking through. It looks rather strong. Might take a few good hits to shatter it.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Windows/strata_window.rsi
    state: strata_window0
  - type: Icon
    sprite: _RMC14/Structures/Windows/strata_window.rsi
    state: strata_window0
  - type: IconSmooth
    key: windows
    additionalKeys:
    - doors
    base: strata_window
    mode: CardinalFlags
  - type: Repairable
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 600 # excessive damage destroys window and frame
        behaviors:
          - !type:PlaySoundBehavior
            sound:
              collection: WindowShatter
          - !type:DoActsBehavior
            acts: ["Destruction"]
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
          - !type:PlaySoundBehavior
            sound:
              collection: WindowShatter
          - !type:SpawnEntitiesBehavior
            spawn:
              ShardGlass:
                min: 1
                max: 1
              PartRodMetal1:
                min: 1
                max: 1

